# Bubble Card modules; "default" applies to every Bubble card.
# Bubble scopes module rules away from the cards inside pop-ups, so card sizes live in each card's grid_options.
default:
  name: Default
  description: Pop-ups end above the floating navbar; Catppuccin accent instead of Bubble's blue
  code: |-
    ha-card {
      --bubble-accent-color: var(--catppuccin-mauve, #c6a0f6);
    }
    .bubble-pop-up-container {
      padding-bottom: calc(130px + env(safe-area-inset-bottom, 0px)) !important;
    }
