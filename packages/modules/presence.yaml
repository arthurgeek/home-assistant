input_select:
  presence_state_arthur:
    name: Presence Arthur
    icon: mdi:account
    options:
      - Just Arrived
      - Just Left
      - Home
      - Away
      - Extended Away

  presence_state_suellen:
    name: Presence Suellen
    icon: mdi:account
    options:
      - Just Arrived
      - Just Left
      - Home
      - Away
      - Extended Away

template:
  - binary_sensor:
      - name: "Living Room Presence"
        unique_id: living_room_presence
        device_class: occupancy
        icon: mdi:motion-sensor
        state: >-
          {% set radar = is_state('binary_sensor.living_room_radar', 'on') %}
          {% set vacuum_active = states('vacuum.roborock') in ['cleaning', 'returning'] %}
          {{ radar and not vacuum_active }}

      # The kitchen opens onto the living room, so the same vacuum runs through it. Its raw radar is class motion
      # and this sensor is the kitchen's occupancy sensor, like living_room_presence above.
      - name: "Kitchen Presence"
        unique_id: kitchen_presence
        device_class: occupancy
        icon: mdi:motion-sensor
        state: >-
          {% set radar = is_state('binary_sensor.kitchenpresencesensor_presence', 'on') %}
          {% set vacuum_active = states('vacuum.roborock') in ['cleaning', 'returning'] %}
          {{ radar and not vacuum_active }}

      # Any occupancy sensor in an area of a floor. The street has no floor (the doorbell is class occupancy), this
      # sensor is in no area, and the raw living room radar is class motion: living_room_presence above is the
      # living room's occupancy sensor.
      - name: "House Occupied"
        unique_id: house_occupied
        device_class: occupancy
        icon: mdi:home-account
        state: >-
          {{ ['ground_floor', 'upper_floor', 'outside'] | map('floor_areas') | sum(start=[]) | map('area_entities')
             | sum(start=[]) | select('match', '^binary_sensor\\.') | select('is_state_attr', 'device_class', 'occupancy')
             | select('is_state', 'on') | list | count > 0 }}

      - name: "Anyone Home"
        unique_id: anyone_home
        device_class: presence
        icon: mdi:account-group
        state: >-
          {{ is_state('person.arthur', 'home')
             or is_state('person.suellen', 'home')
             or is_state('binary_sensor.house_occupied', 'on') }}

      - name: "Everyone Home"
        unique_id: everyone_home
        device_class: presence
        icon: mdi:account-multiple-check
        state: >-
          {{ is_state('person.arthur', 'home')
             and is_state('person.suellen', 'home') }}

script:
  presence_reconcile:
    alias: Presence · Reconcile
    description: Re-syncs each person's presence helper with their actual person state (restart-proof safety net)
    mode: queued
    sequence:
      - repeat:
          for_each:
            - arthur
            - suellen
          sequence:
            - variables:
                person: "{{ states('person.' ~ repeat.item) }}"
                helper: "input_select.presence_state_{{ repeat.item }}"
                current: "{{ states('input_select.presence_state_' ~ repeat.item) }}"
                settled: >-
                  {{ (now() - states['input_select.presence_state_' ~ repeat.item].last_changed).total_seconds() >= 600 }}
                target: >-
                  {% if person in ['unknown', 'unavailable'] %}{{ current }}
                  {% elif person == 'home' %}
                    {{ 'Just Arrived' if current == 'Just Arrived' and not settled else 'Home' }}
                  {% else %}
                    {% if current == 'Extended Away' %}Extended Away
                    {% elif current == 'Just Left' and not settled %}Just Left
                    {% else %}Away{% endif %}
                  {% endif %}
            - if:
                - condition: template
                  value_template: "{{ target != current }}"
              then:
                - action: input_select.select_option
                  target:
                    entity_id: "{{ helper }}"
                  data:
                    option: "{{ target }}"

automation:
  - id: presence_transitions
    alias: Presence · Transitions
    description: >-
      Moves each person's presence helper through Just Arrived → Home and Just Left → Away
      without delays, so restarts and reloads can't leave a helper stuck
    mode: parallel
    triggers:
      - trigger: state
        entity_id:
          - person.arthur
          - person.suellen
        to: home
        not_from:
          - unknown
          - unavailable
        id: arrived
      - trigger: state
        entity_id:
          - person.arthur
          - person.suellen
        from: home
        not_to:
          - unknown
          - unavailable
        id: left
      - trigger: state
        entity_id:
          - input_select.presence_state_arthur
          - input_select.presence_state_suellen
        to:
          - Just Arrived
          - Just Left
        for:
          minutes: 10
        id: settle
      - trigger: state
        entity_id:
          - input_select.presence_state_arthur
          - input_select.presence_state_suellen
        to: Away
        for:
          hours: 24
        id: extended_away
      - trigger: homeassistant
        event: start
        id: reconcile
      - trigger: time_pattern
        minutes: /30
        id: reconcile
    actions:
      - variables:
          who: "{{ trigger.entity_id.split('.')[1] | replace('presence_state_', '') if trigger.entity_id is defined else '' }}"
      - choose:
          - conditions:
              - condition: trigger
                id: arrived
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: "input_select.presence_state_{{ who }}"
                data:
                  option: Just Arrived
          - conditions:
              - condition: trigger
                id: left
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: "input_select.presence_state_{{ who }}"
                data:
                  option: Just Left
          - conditions:
              - condition: trigger
                id: extended_away
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: "input_select.presence_state_{{ who }}"
                data:
                  option: Extended Away
        default:
          # settle + reconcile
          - action: script.presence_reconcile
