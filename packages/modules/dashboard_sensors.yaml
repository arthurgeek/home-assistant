template:
  # Order of the AC carousel on Casa: ACs that are on first (custom_templates/ac.jinja)
  - sensor:
      - name: AC Order
        unique_id: ac_order
        default_entity_id: sensor.ac_order
        icon: mdi:sort
        state: "{% from 'ac.jinja' import ac_live_order %}{{ (ac_live_order() | from_json)[0] }}"
        attributes:
          order: "{% from 'ac.jinja' import ac_live_order %}{{ ac_live_order() | from_json }}"
  - sensor:
      - name: Lights On
        unique_id: lights_on
        icon: mdi:lightbulb-group
        state: >-
          {{ ['ground_floor', 'upper_floor', 'outside'] | map('floor_areas') | sum(start=[]) | map('area_entities')
             | sum(start=[]) | select('match', '^light\\.') | select('is_state', 'on') | list | count }}

      # The temperature inside: the average of what every AC measures in its room
      - name: Inside Temperature
        unique_id: inside_temperature
        default_entity_id: sensor.inside_temperature
        icon: mdi:home-thermometer
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: >-
          {{ states.climate | map(attribute='attributes.current_temperature') | select('is_number') | map('float')
             | list | average | round(1) }}
        availability: >-
          {{ states.climate | map(attribute='attributes.current_temperature') | select('is_number') | list | count > 0 }}

      - name: ACs On
        unique_id: acs_on
        icon: mdi:air-conditioner
        state: >-
          {{ states.climate | rejectattr('state', 'in', ['off', 'unavailable', 'unknown']) | list | count }}

  # Family agenda: events overlapping today (state) and the next 7 days (attribute `upcoming`).
  # The window starts at midnight so events that already ended today still count.
  - triggers:
      - trigger: time_pattern
        minutes: /15
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - action: calendar.get_events
        continue_on_error: true
        target:
          entity_id: calendar.familia
        data:
          start_date_time: "{{ today_at().isoformat() }}"
          end_date_time: "{{ (today_at() + timedelta(days=7)).isoformat() }}"
        response_variable: agenda
    sensor:
      - name: Events Today
        unique_id: events_today
        icon: mdi:calendar-today
        availability: "{{ agenda is defined and 'calendar.familia' in agenda }}"
        state: >-
          {% set events = agenda['calendar.familia'].events %}
          {% set today = now().date() | string %}
          {% set tomorrow = today_at() + timedelta(days=1) %}
          {% set ns = namespace(count=0) %}
          {% for e in events %}
            {% if 'T' in e.start %}
              {% if as_datetime(e.start) < tomorrow and as_datetime(e.end) > today_at() %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% elif e.start <= today and e.end > today %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.count }}
        attributes:
          upcoming: >-
            {% set today = now().date() | string %}
            {% set ns = namespace(items=[]) %}
            {% for e in agenda['calendar.familia'].events | sort(attribute='start') %}
              {% set all_day = 'T' not in e.start %}
              {% set pending = e.end > today if all_day else as_datetime(e.end) > now() %}
              {% if pending %}
                {% set ns.items = ns.items + [{'summary': e.summary, 'start': e.start, 'end': e.end, 'all_day': all_day}] %}
              {% endif %}
            {% endfor %}
            {{ ns.items[:40] }}  # a busy week, for the 7-day events carousel on Casa
