input_select:
  house_mode:
    name: House Mode
    icon: mdi:home-analytics
    options:
      - day
      - night
      - away

template:
  - sensor:
      - name: "House Mode"
        unique_id: house_mode
        icon: >-
          {% if is_state('input_select.house_mode', 'day') %}
            mdi:weather-sunny
          {% elif is_state('input_select.house_mode', 'night') %}
            mdi:weather-night
          {% else %}
            mdi:home-export-outline
          {% endif %}
        state: "{{ states('input_select.house_mode') }}"

script:
  change_house_mode:
    alias: House mode · Switch
    description: Cycles to the next house mode option
    sequence:
      - action: input_select.select_next
        target:
          entity_id: input_select.house_mode

automation:
  - id: house_mode_daylight_transition
    alias: House Mode · Follow Daylight
    description: Switches house mode to day at daylight and to night when dark, if someone is home
    mode: single
    triggers:
      - trigger: illuminance.detected
        target:
          area_id: street
        options:
          behavior: all
          for:
            minutes: 5
        id: day
      - trigger: illuminance.cleared
        target:
          area_id: street
        options:
          behavior: all
          for:
            minutes: 5
        id: night
    conditions:
      - condition: state
        entity_id: binary_sensor.anyone_home
        state: 'on'
      - condition: template
        value_template: "{{ not is_state('input_select.house_mode', trigger.id) }}"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: "{{ trigger.id }}"
