automation:
  - id: office_ac_wall_switch
    alias: Office AC Wall Switch
    description: Keeps the Office AC and its wall switch in step
    use_blueprint:
      path: home/wall_switch_climate.yaml
      input:
        wall_switch: switch.office_ac_wall_switch
        climate: climate.office_ac

  - id: office_area_empty
    alias: Office · Area Empty
    description: Turns off the office lights and AC once the office has been empty for five minutes
    use_blueprint:
      path: home/area_empty.yaml
      input:
        area: office
