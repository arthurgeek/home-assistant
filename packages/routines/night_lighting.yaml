automation:
  - id: outside_lights_by_daylight
    alias: Outside Lights · Follow Daylight
    description: Turn outside lights on after 10 minutes of dark and off after 10 minutes of daylight
    triggers:
      - trigger: illuminance.cleared
        target:
          area_id: street
        options:
          behavior: all
          for:
            minutes: 10
        id: dark
      - trigger: illuminance.detected
        target:
          area_id: street
        options:
          behavior: all
          for:
            minutes: 10
        id: light
    actions:
      # the street area has no floor, so only this automation ever switches its lights
      - action: "light.turn_{{ 'on' if trigger.id == 'dark' else 'off' }}"
        target:
          area_id: street

  - id: samsung_ac_night_lighting
    alias: Turn Off AC Display Light at Night
    description: Turn off front LED display on upper floor Samsung ACs at night
    triggers:
      - trigger: climate.turned_on
        target:
          label_id: samsung
        options:
          behavior: each
    conditions:
      - condition: sun
        after: sunset
        before: sunrise
    actions:
      - action: script.ac_display_light_off
        data:
          device_id: '{{ device_id(trigger.entity_id) }}'

script:
  ac_display_light_off:
    alias: Turn Off AC Display Light
    mode: parallel
    fields:
      device_id:
        description: Device ID
        required: true
    sequence:
      - action: smartthing_extra.send_command
        data:
          device_id: '{{ device_id }}'
          component: main
          capability: execute
          command: execute
          arguments:
            - mode/vs/0
            - x.com.samsung.da.options:
                - Light_On

template:
  - binary_sensor:
      # the doorbell's "is dark" is on in the dark; as a light-class sensor, on is daylight
      - name: Street Daylight
        unique_id: street_daylight
        default_entity_id: binary_sensor.street_daylight
        device_class: light
        icon: mdi:weather-sunny
        state: "{{ is_state('binary_sensor.doorbell_is_dark', 'off') }}"
        availability: "{{ states('binary_sensor.doorbell_is_dark') in ['on', 'off'] }}"
