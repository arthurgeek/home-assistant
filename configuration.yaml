# Loads default set of integrations. Do not remove.
default_config:

# Camera WebRTC goes through the cluster's go2rtc. HA calls its API over the
# LAN to set up each session; only the media port is reachable from outside,
# so the live view works away from home.
go2rtc:
  url: http://10.10.5.231:1984

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  mode: storage
  dashboards:
    catppuccin-home:
      mode: yaml
      title: "Casa"
      icon: mdi:home-heart
      show_in_sidebar: true
      filename: dashboards/catppuccin_home.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  internal_url: !secret internal_url
  external_url: !secret external_url
  packages: !include_dir_named packages
