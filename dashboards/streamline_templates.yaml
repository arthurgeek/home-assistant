# Card templates (streamline-card): each pop-up kind is defined once; pop-up files only pass variables.

# Pop-up of an area's AC. Variables: key (the area id). Everything else is found from the area: its AC, the AC's
# controls, the panel light and, on the LG, energy saving, the off timer and the filter hours (each only if the area has
# it).
ac_popup:
  card:
    type: custom:bubble-card
    card_type: pop-up
    hash: "#ac_[[key]]"
    show_header: false
    bg_blur: 16
    cards:
      - type: custom:button-card
        template: room_header
        variables:
          area: "[[key]]"
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
          rows: auto
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - area: "[[key]]"
              domain: climate
              options:
                type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: ac_card
                    entity: this.entity_id
                  - type: custom:button-card
                    template: ac_options
                    entity: this.entity_id
                    variables:
                      attribute: hvac_mode
                  - type: custom:button-card
                    template: ac_options
                    entity: this.entity_id
                    variables:
                      attribute: preset_mode
                  - type: custom:button-card
                    template: ac_sleep_extend
                    entity: this.entity_id
                  - type: custom:button-card
                    template: ac_options
                    entity: this.entity_id
                    variables:
                      attribute: fan_mode
                  - type: custom:button-card
                    template: ac_options
                    entity: this.entity_id
                    variables:
                      attribute: swing_mode
      - type: custom:bubble-card
        card_type: separator
        name: Extras
        icon: mdi:dots-horizontal-circle-outline
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
          rows: auto
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - area: "[[key]]"
              domain: switch
              entity_id: "*lighting"
              options:
                type: custom:bubble-card
                card_type: button
                name: Luz do painel
                icon: mdi:led-on
            - area: "[[key]]"
              domain: switch
              entity_id: "*energy_saving"
              options:
                type: custom:bubble-card
                card_type: button
                name: Economia de energia
                icon: mdi:leaf
            - area: "[[key]]"
              domain: number
              entity_id: "*schedule_turn_off"
              options:
                type: custom:paper-buttons-row
                styles:
                  flex-wrap: wrap
                  gap: 8px
                  justify-content: flex-start
                base_config:
                  layout: name
                  ripple: none
                  styles:
                    button:
                      padding: 8px 14px
                      border-radius: 18px
                      background: "rgba(73, 77, 100, 0.6)"
                    name:
                      color: "var(--catppuccin-text, #cad3f5)"
                      font-size: 13px
                  tap_action:
                    action: call-service
                    service: number.set_value
                buttons:
                  - name: "Desligar em:"
                    tap_action:
                      action: none
                    styles:
                      button:
                        background: none
                  - name: 1h
                    tap_action:
                      service_data: {entity_id: this.entity_id, value: 1}
                  - name: 2h
                    tap_action:
                      service_data: {entity_id: this.entity_id, value: 2}
                  - name: 4h
                    tap_action:
                      service_data: {entity_id: this.entity_id, value: 4}
                  - name: Cancelar
                    tap_action:
                      service_data: {entity_id: this.entity_id, value: 0}
            - area: "[[key]]"
              domain: sensor
              entity_id: "*filter_remaining"
              options:
                type: custom:bubble-card
                card_type: button
                button_type: state
                name: Filtro (horas restantes)
                icon: mdi:air-filter
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
          rows: auto
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - area: "[[key]]"
              domain: climate
              options:
                type: custom:streamline-card
                template: history_graph
                variables:
                  area: "[[key]]"
                  climate: this.entity_id

# Good Sleep duration chooser, opened by the WindFree Sleep preset. Variables: key (the area id).
ac_sleep_chooser:
  card:
    type: custom:bubble-card
    card_type: pop-up
    hash: "#ac_[[key]]_sleep"
    show_header: false
    bg_blur: 16
    cards:
      - type: custom:button-card
        template: room_header
        variables:
          area: "[[key]]"
          icon: mdi:weather-night
      - type: custom:bubble-card
        card_type: separator
        name: WindFree Sono · desligar em
        icon: mdi:timer-outline
      - type: custom:auto-entities
        show_empty: false
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - area: "[[key]]"
              domain: climate
              options:
                type: custom:paper-buttons-row
                styles:
                  justify-content: center
                  gap: 10px
                base_config:
                  layout: name
                  ripple: none
                  styles:
                    button:
                      padding: 12px 22px
                      border-radius: 20px
                      background: "var(--catppuccin-mauve, #c6a0f6)"
                    name:
                      color: "var(--catppuccin-base, #24273a)"
                      font-size: 16px
                      font-weight: 600
                buttons:
                  - name: 1h
                    tap_action:
                      action: call-service
                      service: script.ac_good_sleep
                      service_data: {entity_id: this.entity_id, hours: 1}
                  - name: 2h
                    tap_action:
                      action: call-service
                      service: script.ac_good_sleep
                      service_data: {entity_id: this.entity_id, hours: 2}
                  - name: 4h
                    tap_action:
                      action: call-service
                      service: script.ac_good_sleep
                      service_data: {entity_id: this.entity_id, hours: 4}
                  - name: 8h
                    tap_action:
                      action: call-service
                      service: script.ac_good_sleep
                      service_data: {entity_id: this.entity_id, hours: 8}

# Room pop-up. Variables: key (the area id), extra_content (cards after the generated ones, for what the area's
# entities can't tell, e.g. a speaker or the washer). The header, presence, lights, AC and temperature history are all
# found from the area, and each section is absent when the area has nothing for it.
room_popup:
  default:
    - extra_content:
        - type: custom:button-card
          template: nothing
  card:
    type: custom:bubble-card
    card_type: pop-up
    hash: "#[[key]]"
    show_header: false
    bg_blur: 16
    cards:
      - type: custom:button-card
        template: room_header
        variables:
          area: "[[key]]"
      - type: custom:button-card
        template: section_heading
        variables:
          area: "[[key]]"
          title: Presença
          icon: mdi:motion-sensor
          domain: binary_sensor
          device_class: occupancy
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
          rows: auto
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - area: "[[key]]"
              domain: binary_sensor
              attributes:
                device_class: occupancy
              options:
                type: custom:bubble-card
                card_type: button
                button_type: state
                name: Presença
                icon: mdi:motion-sensor
      - type: custom:button-card
        template: section_heading
        variables:
          area: "[[key]]"
          title: Iluminação
          icon: mdi:lightbulb
          domain: light
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
          rows: auto
        card:
          type: horizontal-stack
        card_param: cards
        filter:
          include:
            - area: "[[key]]"
              domain: light
              options:
                type: custom:bubble-card
                card_type: button
                button_type: state
                tap_action:
                  action: toggle
                button_action:
                  tap_action:
                    action: more-info
      - type: custom:button-card
        template: section_heading
        variables:
          area: "[[key]]"
          title: Climatização
          icon: mdi:air-conditioner
          domain: climate
      - type: custom:auto-entities
        show_empty: false
        grid_options:
          columns: full
          rows: auto
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - area: "[[key]]"
              domain: climate
              options:
                type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: ac_card
                    entity: this.entity_id
                  - type: custom:streamline-card
                    template: history_graph
                    variables:
                      area: "[[key]]"
                      climate: this.entity_id
      - type: vertical-stack
        cards: "[[extra_content]]"

# 24h temperature and humidity graph of an area: the temperature and humidity sensors set on the area, and the AC's
# reading when the area has no temperature sensor. Variables: area (id), climate (optional, that fallback).
history_graph:
  default:
    - climate: ""
  card:
    type: custom:mini-graph-card
    name: Últimas 24h
    hours_to_show: 24
    points_per_hour: 2
    line_width: 2
    height: 120
    entities_javascript: |
      const area = areas['[[area]]'] || {};
      const entities = [area.temperature_entity_id
        ? { entity: area.temperature_entity_id, name: 'Temperatura', color: '#f5a97f' }
        : { entity: '[[climate]]', attribute: 'current_temperature', name: 'Temperatura', color: '#f5a97f' }];
      if (area.humidity_entity_id) entities.push({ entity: area.humidity_entity_id, name: 'Umidade', color: '#8aadf4', y_axis: 'secondary' });
      return entities;
    show:
      labels: true
      labels_secondary: true
    card_mod:
      style: |-
        ha-card { background: rgba(36, 39, 58, 0.7); border-radius: 24px; border: 1px solid rgba(202, 211, 245, 0.08); }

# Logbook of recent activity, styled like the other pop-up sections. Variables: title, hours, entities.
# Instances set grid_options rows: auto, since Bubble sizes pop-up cards from the instance.
activity_log:
  card:
    type: logbook
    title: "[[title]]"
    hours_to_show: "[[hours]]"
    target:
      entity_id: "[[entities]]"
    card_mod:
      style: |-
        ha-card { background: rgba(36, 39, 58, 0.7); border-radius: 24px; border: 1px solid rgba(202, 211, 245, 0.08); }
        .card-header { font-size: 16px; font-weight: 600; padding: 16px 16px 0; }

# A media player as a Bubble media card. Variables: entity, name, icon, layout (normal | large).
speaker_card:
  default:
    - layout: normal
  card:
    type: custom:bubble-card
    card_type: media-player
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    cover_background: true
    card_layout: "[[layout]]"

# One position of the Casa AC carousel: the AC at index `slot` of sensor.ac_order (on ones first). Re-evaluated as states
# change, so the carousel reorders itself. Variables: slot.
ac_slot:
  card:
    type: custom:button-card
    template: ac_card
    variables_javascript: |-
      return { climate: states['sensor.ac_order']?.attributes?.order?.[variables.slot] };

# The Sonos card (Casa while music plays, and the media pop-up), on the Music Assistant players: they carry the
# art and title (e.g. Spotify via MA) and group via MA. Album art blurred behind the controls.
sonos:
  card:
    type: custom:sonos-card
    # take the Music Assistant players (the card defaults to Sonos-platform ones) and search through MA;
    # exclusive with showNonSonosPlayers / useMusicAssistant
    entityPlatform: music_assistant
    entities:
      - media_player.living_room_ma
      - media_player.kids_bedroom_ma
      - media_player.sonos_move_ma
    # player, choose a playing group, group/ungroup, the queue (mass_queue), search (via MA), browse,
    # per-speaker volumes
    sections:
      - player
      - groups
      - grouping
      - queue
      - search
      - media browser
      - volumes
    adjustVolumeRelativeToMainPlayer: true
    # MA fetches Spotify results 10 per request, one request after another, and Spotify throttles bursts: 10
    # results is one request per type, and tracks only by default (the card otherwise searches 5 types)
    search:
      searchLimit: 10
      defaultMediaType: track
      autoSearchDebounceMs: 200  # the card waits 1 s after the last key by default
    player:
      artworkAsBackground: true
      artworkAsBackgroundBlur: 10
      controlsAndHeaderBackgroundOpacity: 0.7
    card_mod:
      style: |-
        ha-card { border-radius: 24px; border: 1px solid rgba(202, 211, 245, 0.08); overflow: hidden;
                  box-shadow: none; background: rgba(36, 39, 58, 0.7); }
