type: custom:bubble-card
card_type: pop-up
hash: '#calendar'
name: Agenda da Família
icon: mdi:calendar-month
bg_blur: 16
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Próximos dias
    icon: mdi:account-group

  - type: calendar
    entities:
      - calendar.familia
      - calendar.pessoal
    initial_view: listWeek
    show_add_event: true
    add_event_style: below
    add_event_size: medium
    card_mod:
      style:
        ha-full-calendar$: |
          ha-button-toggle-group, .view-switcher { display: none !important; }
        .: |
          ha-card { background: rgba(36, 39, 58, 0.7); border-radius: 20px; border: 1px solid rgba(202, 211, 245, 0.08); }

  - type: custom:bubble-card
    card_type: separator
    name: Aniversários
    icon: mdi:cake-variant

  - type: calendar
    entities:
      - calendar.birthdays
    initial_view: listWeek
    card_mod:
      style:
        ha-full-calendar$: |
          ha-button-toggle-group, .view-switcher { display: none !important; }
        .: |-
          ha-card { background: rgba(36, 39, 58, 0.7); border-radius: 20px; border: 1px solid rgba(202, 211, 245, 0.08); }
