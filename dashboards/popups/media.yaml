type: custom:bubble-card
card_type: pop-up
hash: '#media'
name: Mídia & Som
icon: mdi:speaker-multiple
bg_blur: 16
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Sonos Multi-Room
    icon: mdi:speaker

  - type: custom:sonos-card
    mediaTitleRegexToReplace: '^(aac://)?(https?://)?[0-9.]+:8097/source/.*$'
    mediaTitleReplacement: ''
    entities:
      - media_player.living_room
      - media_player.unnamed_room
      - media_player.kids_bedroom_kids_bedroom
    sections:
      - player
      - grouping
      - volumes
      - media browser

  - type: custom:bubble-card
    card_type: separator
    name: Players da Casa
    icon: mdi:television-play

  - type: custom:mini-media-player
    entity: media_player.living_room
    name: Sala
    artwork: cover
    hide:
      power: true

  - type: custom:mini-media-player
    entity: media_player.unnamed_room
    name: Sonos Move
    artwork: cover
    hide:
      power: true

  - type: custom:mini-media-player
    entity: media_player.tv_samsung_6_series_55
    name: TV Sala de Estar
    icon: mdi:television
    artwork: cover
