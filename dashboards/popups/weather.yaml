type: custom:bubble-card
card_type: pop-up
hash: '#weather'
name: Previsão do Tempo
icon: mdi:weather-partly-cloudy
bg_blur: 16
cards:
  - type: custom:weather-forecast-card
    entity: weather.home
    show_current: true
    show_forecast: true
    default_forecast: hourly
    show_condition_effects: true
    show_moon_phase: true
    show_attributes:
      - humidity
      - wind_speed
      - apparent_temperature
      - precipitation
    attributes_layout: compact
    tap_action:
      action: none
    forecast:
      mode: chart
      show_attribute_selector: true
      show_sun_times: true
    card_mod:
      style: |-
        ha-card { background: rgba(36, 39, 58, 0.7); border-radius: 24px; border: 1px solid rgba(202, 211, 245, 0.08); }
