type: custom:bubble-card
card_type: pop-up
hash: '#weather'
name: Previsão do Tempo
icon: mdi:weather-partly-cloudy
bg_blur: 16
cards:
  - type: custom:weather-forecast-card
    entity: weather.forecast_home
    name: Casa
    show_hourly_forecast: true
    show_daily_forecast: true
    card_mod:
      style: |
        ha-card {
          border-radius: 24px;
          border: 1px solid rgba(202, 211, 245, 0.08);
          overflow: hidden;
        }

  - type: custom:bubble-card
    card_type: separator
    name: Detalhes Climáticos
    icon: mdi:thermometer-lines

  - type: horizontal-stack
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: weather.forecast_home
        name: Condição
        icon: mdi:weather-cloudy
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.living_room_radar_target_distance
        name: Radar Sala
        icon: mdi:radar
