type: custom:bubble-card
card_type: pop-up
hash: '#climate'
name: Climatização
icon: mdi:air-conditioner
bg_blur: 16
cards:
  # Bubble pre-warms each built-in card type once, from the first sample it meets; this one is valid, where the
  # auto-entities placeholders below have no cards yet
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: nothing
  - type: custom:bubble-card
    card_type: button
    button_type: name
    name: Desligar Todos os Ar-Condicionados
    icon: mdi:power
    tap_action:
      action: perform-action
      perform_action: script.turn_off_all_acs
      confirmation:
        text: Desligar todos os ar-condicionados?
  - type: custom:bubble-card
    card_type: separator
    name: Consumo
    icon: mdi:lightning-bolt
  - type: custom:button-card
    template: tile
    entity: sensor.ac_energy_month_total
    grid_options:
      columns: 6
    styles:
      card:
        - height: 110px  # the tiles' height on Casa
    variables:
      icon: mdi:flash
      label: "[[[ const v = parseFloat(entity.state); return isNaN(v) ? '--' : `${v.toFixed(1).replace('.', ',')} kWh` ]]]"
      sublabel: Este mês · todos os ACs
    tap_action:
      action: navigate
      navigation_path: /energy
  - type: custom:button-card
    template: tile
    entity: sensor.ac_power_total
    grid_options:
      columns: 6
    styles:
      card:
        - height: 110px  # the tiles' height on Casa
    variables:
      icon: mdi:flash-outline
      label: "[[[ const w = parseFloat(entity.state); return isNaN(w) ? '--' : `${Math.round(w)} W` ]]]"
      sublabel: Agora · ACs Samsung
      active: "[[[ return parseFloat(entity.state) > 0 ]]]"
      accent: "var(--catppuccin-yellow, #eed49f)"
  - type: custom:auto-entities
    show_empty: false
    grid_options:
      columns: full
    card:
      type: distribution
      title: Este mês por ar-condicionado
    filter:
      include:
        - entity_id: sensor.ac_month_*
  - type: custom:auto-entities
    show_empty: false
    grid_options:
      columns: full
      rows: auto
    card:
      type: statistics-graph
      title: Consumo por mês
      chart_type: bar-stack
      period: month
      stat_types:
        - change
      days_to_show: 180
    filter:
      include:
        - entity_id: sensor.*_ac_energy
  - type: custom:bubble-card
    card_type: separator
    name: Aparelhos
    icon: mdi:air-conditioner
  - type: custom:auto-entities
    show_empty: false
    grid_options:
      columns: full
      rows: auto
    card:
      type: vertical-stack
    card_param: cards
    filter:
      include:
        - domain: climate
          options:
            type: custom:button-card
            template: ac_card
