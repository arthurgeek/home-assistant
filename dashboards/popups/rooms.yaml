type: vertical-stack
cards:
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: living_room
      extra_content:
        - type: custom:bubble-card
          card_type: separator
          name: Áudio & Vídeo
          icon: mdi:television-speaker
        - type: custom:mini-media-player
          entity: media_player.living_room
          name: Sonos
          artwork: cover
          hide:
            power: true
        - type: custom:mini-media-player
          entity: media_player.tv_samsung_6_series_55
          name: TV
          icon: mdi:television
          artwork: cover
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: kitchen
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: office
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: main_bedroom
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: kids_bedroom_1
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: kids_bedroom_2
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: kids_bedroom_3
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: garage
  - type: custom:streamline-card
    template: room_popup
    variables:
      key: laundry_area
