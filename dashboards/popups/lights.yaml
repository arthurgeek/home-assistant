type: custom:bubble-card
card_type: pop-up
hash: '#lights'
name: Iluminação
icon: mdi:lightbulb-multiple
bg_blur: 16
cards:
  - type: custom:button-card
    template: tile
    grid_options:
      columns: 6
    variables:
      icon: mdi:home-lightbulb-outline
      label: Apagar
      sublabel: Luzes internas
    styles:
      card:
        - height: 110px  # the tiles' height on Casa
    tap_action:
      action: perform-action
      perform_action: script.turn_off_indoor_lights
      haptic: success
  - type: custom:button-card
    template: tile
    grid_options:
      columns: 6
    variables:
      icon: mdi:lightbulb-off-outline
      label: Apagar
      sublabel: Todas as luzes
    styles:
      card:
        - height: 110px  # the tiles' height on Casa
    tap_action:
      action: perform-action
      perform_action: script.turn_off_all_lights
      haptic: success
  - type: custom:bubble-card
    card_type: separator
    name: Superior
    icon: mdi:home-floor-2
  - type: custom:button-card
    template: light_tile
    entity: light.office_light
    grid_options:
      columns: 6
  - type: custom:bubble-card
    card_type: separator
    name: Externo
    icon: mdi:pine-tree
  - type: custom:button-card
    template: light_tile
    entity: light.garage_light
    grid_options:
      columns: 6
    variables:
      detail: principal
  - type: custom:button-card
    template: light_tile
    entity: light.garage_front_light
    grid_options:
      columns: 6
    variables:
      detail: frontal
  - type: custom:bubble-card
    card_type: separator
    name: Rua
    icon: mdi:road-variant
  - type: custom:button-card
    template: tile
    entity: light.street_lights
    grid_options:
      columns: 6
    styles:
      card:
        - height: 110px  # the tiles' height on Casa
    tap_action:
      action: none
    variables:
      icon: mdi:outdoor-lamp
      label: "[[[ return entity?.state === 'on' ? 'Acesas' : entity?.state === 'off' ? 'Apagadas' : '--' ]]]"
      sublabel: Rua · automático
      active: "[[[ return entity?.state === 'on' ]]]"
      accent: "var(--catppuccin-yellow, #eed49f)"
