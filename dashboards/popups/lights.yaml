type: custom:bubble-card
card_type: pop-up
hash: '#lights'
name: Iluminação
icon: mdi:lightbulb-multiple
bg_blur: 16
cards:
  # Bubble pre-warms each built-in card type once, from the first sample it meets; this one is valid, where the
  # auto-entities placeholders below have no cards yet
  - type: vertical-stack
    cards:
      - type: custom:button-card
        template: nothing
  - type: custom:button-card
    template: tile
    grid_options:
      columns: 6
    variables:
      icon: mdi:home-lightbulb-outline
      label: Apagar
      sublabel: Luzes internas
    styles:
      card:
        - height: 110px  # the tiles' height on Casa
    tap_action:
      action: perform-action
      perform_action: script.turn_off_indoor_lights
      haptic: success
  - type: custom:button-card
    template: tile
    grid_options:
      columns: 6
    variables:
      icon: mdi:lightbulb-off-outline
      label: Apagar
      sublabel: Todas as luzes
    styles:
      card:
        - height: 110px  # the tiles' height on Casa
    tap_action:
      action: perform-action
      perform_action: script.turn_off_all_lights
      haptic: success
  - type: custom:button-card
    template: section_heading
    variables:
      floor: ground_floor
      domain: light
  - type: custom:auto-entities
    show_empty: false
    grid_options:
      columns: full
      rows: auto
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - type: custom:button-card
          template: nothing
    card_param: cards
    filter:
      include:
        - floor: ground_floor
          domain: light
          options:
            type: custom:button-card
            template: light_tile
  - type: custom:button-card
    template: section_heading
    variables:
      floor: upper_floor
      domain: light
  - type: custom:auto-entities
    show_empty: false
    grid_options:
      columns: full
      rows: auto
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      include:
        - floor: upper_floor
          domain: light
          options:
            type: custom:button-card
            template: light_tile
  - type: custom:button-card
    template: section_heading
    variables:
      floor: outside
      domain: light
  - type: custom:auto-entities
    show_empty: false
    grid_options:
      columns: full
      rows: auto
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    filter:
      include:
        - floor: outside
          domain: light
          options:
            type: custom:button-card
            template: light_tile
  - type: custom:button-card
    template: section_heading
    variables:
      area: street
      title: Rua
      icon: mdi:road-variant
      domain: light
  - type: custom:auto-entities
    show_empty: false
    grid_options:
      columns: full
      rows: auto
    card:
      type: vertical-stack
    card_param: cards
    filter:
      include:
        - area: street
          domain: light
          options:
            type: custom:button-card
            template: tile
            styles:
              card:
                - height: 110px  # the tiles' height on Casa
            tap_action:
              action: none
            variables:
              icon: mdi:outdoor-lamp
              label: "[[[ return entity?.state === 'on' ? 'Acesas' : entity?.state === 'off' ? 'Apagadas' : '--' ]]]"
              sublabel: Rua · automático
              active: "[[[ return entity?.state === 'on' ]]]"
              accent: "var(--catppuccin-yellow, #eed49f)"
