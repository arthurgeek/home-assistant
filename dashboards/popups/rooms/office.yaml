type: custom:streamline-card
template: room_popup
variables:
  key: office
  icon: mdi:desk
  cards:
    - type: custom:bubble-card
      card_type: separator
      name: Presença
      icon: mdi:motion-sensor
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: binary_sensor.office_presence
      name: Presença no escritório
      icon: mdi:motion-sensor
    - type: custom:bubble-card
      card_type: separator
      name: Iluminação
      icon: mdi:lightbulb
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: light.office_light
      name: Luz do escritório
      icon: mdi:desk-lamp
      tap_action:
        action: toggle
      button_action:
        tap_action:
          action: more-info
    - type: custom:bubble-card
      card_type: separator
      name: Climatização
      icon: mdi:air-conditioner
    - !include ../../cards/ac/office.yaml
    - type: custom:streamline-card
      template: history_graph
      grid_options:
        columns: full  # Bubble gives cards without a size hint half the pop-up, one row high
        rows: auto
      variables:
        temperature: sensor.office_room
        humidity: sensor.office_office_air_conditioner_humidity
