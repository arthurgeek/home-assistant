type: custom:streamline-card
template: room_popup
variables:
  key: kids_bedroom_2
  icon: mdi:bed
  cards:
    - type: custom:bubble-card
      card_type: separator
      name: Climatização
      icon: mdi:air-conditioner
    - !include ../../cards/ac/kids_bedroom_2.yaml
    - type: custom:streamline-card
      template: history_graph
      grid_options:
        columns: full  # Bubble gives cards without a size hint half the pop-up, one row high
        rows: auto
      variables:
        temperature: sensor.kids_bedroom_2_room
        humidity: sensor.kids_bedroom_2_ac_humidity
