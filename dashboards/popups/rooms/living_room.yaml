type: custom:streamline-card
template: room_popup
variables:
  key: living_room
  icon: mdi:sofa
  cards:
    - type: custom:bubble-card
      card_type: separator
      name: Presença
      icon: mdi:motion-sensor
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: binary_sensor.living_room_presence
      name: Presença na sala
      icon: mdi:motion-sensor
    - type: custom:bubble-card
      card_type: separator
      name: Climatização
      icon: mdi:air-conditioner
    - !include ../../cards/ac/living_room.yaml
    - type: custom:bubble-card
      card_type: separator
      name: Áudio & Vídeo
      icon: mdi:television-speaker
    - type: custom:mini-media-player
      entity: media_player.living_room
      name: Sonos
      artwork: cover
      hide:
        power: true
    - type: custom:mini-media-player
      entity: media_player.tv_samsung_6_series_55
      name: TV
      icon: mdi:television
      artwork: cover
