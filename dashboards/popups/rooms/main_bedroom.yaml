type: custom:streamline-card
template: room_popup
variables:
  key: main_bedroom
  icon: mdi:bed-king
  cards:
    - type: custom:bubble-card
      card_type: separator
      name: Climatização
      icon: mdi:air-conditioner
    - !include ../../cards/ac/main_bedroom.yaml
    - type: custom:streamline-card
      template: history_graph
      grid_options:
        columns: full  # Bubble gives cards without a size hint half the pop-up, one row high
        rows: auto
      variables:
        temperature: sensor.main_bedroom_room
        humidity: sensor.main_bedroom_main_bedroom_ac_humidity
