type: custom:bubble-card
card_type: pop-up
hash: '#vacuum'
name: Roborock Qrevo Curv
icon: mdi:robot-vacuum
bg_blur: 16
cards:
  - type: picture-entity
    entity: image.living_room_roborock_qrevo_curv_series_map_0
    show_name: false
    show_state: false
    card_mod:
      style: |
        ha-card {
          border-radius: 20px;
          overflow: hidden;
          border: 1px solid rgba(202, 211, 245, 0.08);
        }

  - type: horizontal-stack
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.roborock_status
        name: Status
        icon: mdi:information-outline
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.roborock_qrevo_curv_series_battery
        name: Bateria
        icon: mdi:battery-charging

  - type: custom:bubble-card
    card_type: separator
    name: Comandos de Limpeza (Piso Térreo)
    icon: mdi:play-circle-outline

  - type: horizontal-stack
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Iniciar Limpeza
        icon: mdi:play
        tap_action:
          action: call-service
          service: vacuum.start
          target:
            entity_id: vacuum.roborock
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Pausar
        icon: mdi:pause
        tap_action:
          action: call-service
          service: vacuum.pause
          target:
            entity_id: vacuum.roborock
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Retornar à Base
        icon: mdi:home-import-outline
        tap_action:
          action: call-service
          service: vacuum.return_to_base
          target:
            entity_id: vacuum.roborock

  - type: custom:bubble-card
    card_type: separator
    name: Controles da Estação Dock
    icon: mdi:ev-station

  - type: horizontal-stack
    cards:
      - type: custom:bubble-card
        card_type: button
        entity: switch.living_room_roborock_qrevo_curv_series_dock_dust_emptying
        name: Esvaziar Pó
        icon: mdi:delete-sweep
      - type: custom:bubble-card
        card_type: button
        entity: switch.living_room_roborock_qrevo_curv_series_dock_mop_washing
        name: Lavar Mop
        icon: mdi:water-sync
      - type: custom:bubble-card
        card_type: button
        entity: switch.living_room_roborock_qrevo_curv_series_dock_mop_drying
        name: Secar Mop
        icon: mdi:fan-auto

  - type: custom:bubble-card
    card_type: separator
    name: Manutenção e Desgaste
    icon: mdi:wrench-clock

  - type: entities
    entities:
      - entity: sensor.roborock_qrevo_curv_series_main_brush_time_left
        name: Escova Principal (horas restantes)
        icon: mdi:brush
      - entity: sensor.roborock_qrevo_curv_series_side_brush_time_left
        name: Escova Lateral (horas restantes)
        icon: mdi:rotate-right
      - entity: sensor.roborock_qrevo_curv_series_filter_time_left
        name: Filtro de Ar (horas restantes)
        icon: mdi:air-filter
    card_mod:
      style: |-
        ha-card {
          background: rgba(36, 39, 58, 0.6);
          border-radius: 20px;
          border: 1px solid rgba(202, 211, 245, 0.08);
        }
