type: custom:streamline-card
template: ac_popup
variables:
  key: living_room
  climate: climate.living_room_ac
  icon: mdi:sofa
  display: switch.living_room_ac_lighting
  ac_card: !include ../../cards/ac/living_room.yaml
  # LG only: energy saving, auto-off timer and filter hours
  extra_card:
    type: vertical-stack
    cards:
      - type: custom:bubble-card
        card_type: button
        entity: switch.living_room_ac_energy_saving
        name: Economia de energia
        icon: mdi:leaf
      - type: custom:paper-buttons-row
        styles:
          flex-wrap: wrap
          gap: 8px
          justify-content: flex-start
        base_config:
          layout: name
          ripple: none
          styles:
            button:
              padding: 8px 14px
              border-radius: 18px
              background: "rgba(73, 77, 100, 0.6)"
            name:
              color: "var(--catppuccin-text, #cad3f5)"
              font-size: 13px
          tap_action:
            action: call-service
            service: number.set_value
        buttons:
          - name: "Desligar em:"
            tap_action:
              action: none
            styles:
              button:
                background: none
          - name: 1h
            tap_action:
              service_data: {entity_id: number.living_room_ac_schedule_turn_off, value: 1}
          - name: 2h
            tap_action:
              service_data: {entity_id: number.living_room_ac_schedule_turn_off, value: 2}
          - name: 4h
            tap_action:
              service_data: {entity_id: number.living_room_ac_schedule_turn_off, value: 4}
          - name: Cancelar
            tap_action:
              service_data: {entity_id: number.living_room_ac_schedule_turn_off, value: 0}
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.living_room_ac_filter_remaining
        name: Filtro (horas restantes)
        icon: mdi:air-filter
