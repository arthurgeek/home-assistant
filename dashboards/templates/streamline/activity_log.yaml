# Logbook of recent activity, styled like the other pop-up sections. Variables: title, hours, entities.
# Instances set grid_options rows: auto, since Bubble sizes pop-up cards from the instance.
activity_log:
  card:
    type: logbook
    title: "[[title]]"
    hours_to_show: "[[hours]]"
    target:
      entity_id: "[[entities]]"
    card_mod:
      style: |-
        ha-card { background: rgba(36, 39, 58, 0.7); border-radius: 24px; border: 1px solid rgba(202, 211, 245, 0.08); }
        .card-header { font-size: 16px; font-weight: 600; padding: 16px 16px 0; }
