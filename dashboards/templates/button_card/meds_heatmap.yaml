# ==========================================================================
# Meds heatmap: 13 weeks of doses from sensor.meds_log, each day split into morning (top) and evening (bottom)
# It has no variables.
# ==========================================================================
meds_heatmap:
  template:
    - base_card
  show_name: false
  show_icon: false
  show_state: false
  show_label: false
  tap_action:
    action: none
  styles:
    grid:
      - grid-template-areas: "'map'"
  custom_fields:
    map: |-
      [[[
        const days = entity?.attributes?.days || {};
        const pad = (n) => String(n).padStart(2, '0');
        const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const logged = Object.keys(days).sort();
        const first = logged[0];
        const now = new Date();
        const today = key(now);
        const due = { morning: 9, evening: 21 };
        const status = (k, dose) => {
          if (days[k]?.[dose]) return 'taken';
          if (!first || k < first || k > today) return 'none';
          if (k === today) return now.getHours() >= due[dose] ? 'pending' : 'none';
          return 'missed';
        };
        const color = { taken: '#a6da95', missed: 'rgba(237, 135, 150, 0.75)', pending: '#eed49f', none: 'rgba(202, 211, 245, 0.07)' };
        // A day: top half = 09:00 dose, bottom half = 21:00 dose
        const half = (m, e, title = '') => `<div title="${title}" style="width: 18px; height: 20px; display: flex; flex-direction: column; gap: 3px;">
          <div style="flex: 1; border-radius: 4px 4px 1px 1px; background: ${color[m]};"></div>
          <div style="flex: 1; border-radius: 1px 1px 4px 4px; background: ${color[e]};"></div></div>`;
        // Columns are weeks (Monday first), the last one is this week
        const start = new Date(now); start.setHours(12, 0, 0, 0);
        start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - 12 * 7);
        let cols = '';
        let taken30 = 0, due30 = 0;
        const since30 = new Date(now); since30.setDate(since30.getDate() - 30);
        for (let w = 0; w < 13; w++) {
          let cells = '';
          for (let d = 0; d < 7; d++) {
            const day = new Date(start); day.setDate(start.getDate() + w * 7 + d);
            const k = key(day);
            const m = status(k, 'morning'), e = status(k, 'evening');
            if (day >= since30) for (const s of [m, e]) { if (s === 'taken') taken30++; if (s === 'taken' || s === 'missed') due30++; }
            cells += half(m, e, k);
          }
          cols += `<div style="display: flex; flex-direction: column; gap: 4px;">${cells}</div>`;
        }
        // Streak: complete days in a row, counting back from the last complete one
        let streak = 0;
        const d = new Date(now);
        if (!(days[today]?.morning && days[today]?.evening)) d.setDate(d.getDate() - 1);
        while (days[key(d)]?.morning && days[key(d)]?.evening) { streak++; d.setDate(d.getDate() - 1); }
        const weekdays = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map((l) => `<div style="height: 20px; line-height: 20px;">${l}</div>`).join('');
        const legend = (c, t) => `<span style="display: inline-flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 3px; background: ${c};"></span>${t}</span>`;
        return `<div style="text-align: left; color: var(--catppuccin-text, #cad3f5);">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;">
            <div style="font-size: 16px; font-weight: 600;">Histórico</div>
            <div style="font-size: 12px; color: var(--catppuccin-subtext0, #a5adcb);">30 dias: ${taken30}/${due30} · sequência ${streak} ${streak === 1 ? 'dia' : 'dias'}</div>
          </div>
          <div style="display: flex; gap: 4px; justify-content: center;">
            <div style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: var(--catppuccin-subtext0, #a5adcb); margin-right: 2px;">${weekdays}</div>
            ${cols}
          </div>
          <div style="display: flex; gap: 12px; justify-content: center; margin-top: 12px; font-size: 11px; color: var(--catppuccin-subtext0, #a5adcb);">
            ${legend(color.taken, 'tomado')}${legend(color.missed, 'esquecido')}${legend(color.pending, 'pendente')}
          </div>
          <div style="display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 8px; font-size: 11px; color: var(--catppuccin-subtext0, #a5adcb);">
            ${half('taken', 'none')}<div style="line-height: 1.3; text-align: left;">manhã 09:00<br>noite 21:00</div>
          </div></div>`;
      ]]]
