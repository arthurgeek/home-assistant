# The look every card shares (Catppuccin Macchiato): translucent rounded card, text and label colours.
# Variables: accent_color.

base_card:
  variables:
    accent_color: "var(--catppuccin-mauve, #c6a0f6)"
  styles:
    card:
      - background: "rgba(36, 39, 58, 0.7)"
      - border-radius: "24px"
      - border: "1px solid rgba(202, 211, 245, 0.08)"
      - box-shadow: none
      - padding: "16px"
      - transition: "all 0.25s ease-in-out"
    name:
      - color: "var(--catppuccin-text, #cad3f5)"
      - font-weight: "600"
      - font-size: "16px"
    label:
      - color: "var(--catppuccin-subtext0, #a5adcb)"
      - font-size: "12px"
