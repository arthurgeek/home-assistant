# Catppuccin Macchiato Button Card Templates

base_card:
  variables:
    accent_color: "var(--catppuccin-mauve, #c6a0f6)"
  styles:
    card:
      - background: "rgba(36, 39, 58, 0.7)"
      - border-radius: "24px"
      - border: "1px solid rgba(202, 211, 245, 0.08)"
      - box-shadow: none
      - padding: "16px"
      - transition: "all 0.25s ease-in-out"
    name:
      - color: "var(--catppuccin-text, #cad3f5)"
      - font-weight: "600"
      - font-size: "16px"
    label:
      - color: "var(--catppuccin-subtext0, #a5adcb)"
      - font-size: "12px"

scene_button:
  variables:
    scene_name: "Cena"
    scene_icon: "mdi:star"
    accent_color: "var(--catppuccin-mauve, #c6a0f6)"
  styles:
    card:
      - background: "rgba(54, 58, 79, 0.6)"
      - border-radius: "18px"
      - border: "1px solid rgba(202, 211, 245, 0.08)"
      - padding: "12px 16px"
      - display: "flex"
      - align-items: "center"
      - justify-content: "center"
      - gap: "8px"
      - transition: "all 0.2s ease"
    grid:
      - grid-template-areas: "'i n'"
      - grid-template-columns: "min-content auto"
    icon:
      - color: "[[[ return variables.accent_color ]]]"
      - width: "20px"
      - height: "20px"
    name:
      - color: "var(--catppuccin-text, #cad3f5)"
      - font-size: "13px"
      - font-weight: "600"

# ==========================================================================
# Shared animations (state-gated by each template; respects reduced motion)
# ==========================================================================
anim:
  extra_styles: |
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      20% { transform: rotate(-6deg) translate(-2px, 1px); }
      40% { transform: rotate(-10deg) translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: rotate(10deg) translate(2px, -2px); }
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(237, 135, 150, 0.0); }
      50% { box-shadow: 0 0 0 6px rgba(237, 135, 150, 0.45); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 rgba(238, 212, 159, 0); }
      50% { box-shadow: 0 0 16px rgba(238, 212, 159, 0.6); }
    }
    @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    ha-card { animation: fade-up 250ms ease-out backwards; }
    ha-card:active { transform: scale(0.97); transition: transform 120ms ease; }
    @media (prefers-reduced-motion: reduce) {
      *, ha-card { animation: none !important; transition: none !important; }
    }

# ==========================================================================
# AC card: current temp (+ humidity), temp curve background, mode buttons,
# vertical target control. Samsung: WindFree; LG: Eco switch.
# ==========================================================================
ac_card:
  template:
    - base_card
    - anim
  variables:
    climate: ""
    room: null
    samsung: true
    temp_sensor: null
    humidity_sensor: null
    power_sensor: null
    energy_today_sensor: null
    eco_switch: null
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  # a tap opens the AC's pop-up wherever the card is (Casa, the climate pop-up, a room pop-up); inside that pop-up
  # it opens the AC's own dialog, with its history and attributes
  tap_action:
    action: >-
      [[[ const id = variables.climate;
          return location.hash === '#ac_' + id.replace('climate.', '').replace(/_ac$/, '') ? 'more-info' : 'navigate'; ]]]
    navigation_path: "[[[ const id = variables.climate; return '#ac_' + id.replace('climate.', '').replace(/_ac$/, ''); ]]]"
    entity: "[[[ return variables.climate ]]]"
  hold_action:
    action: navigate
    navigation_path: "#climate"
  styles:
    card:
      - height: 160px
      - padding: 12px 10px 12px 16px
      - overflow: hidden
    grid:
      - grid-template-areas: "'temp target' 'title target' 'modes target'"
      - grid-template-columns: 1fr min-content
      - grid-template-rows: 1fr min-content min-content
      - column-gap: 8px
      - row-gap: 4px
    custom_fields:
      graph:
        - position: absolute
        - left: 0
        - right: 0
        - bottom: 0
        - pointer-events: none
        - opacity: 0.5
      sleepbar:
        - position: absolute
        - left: 0
        - right: 0
        - bottom: 0
        - z-index: 2
        - pointer-events: none
      temp:
        - justify-self: start
        - align-self: end
        - z-index: 1
      title:
        - justify-self: start
        - align-self: start
        - text-align: left
        - z-index: 1
      modes:
        - justify-self: start
        - align-self: end
        - z-index: 1
      target:
        - align-self: center
        - z-index: 1
  custom_fields:
    temp: |
      [[[
        const c = states[variables.climate];
        const raw = variables.temp_sensor ? states[variables.temp_sensor]?.state : c?.attributes?.current_temperature;
        const t = parseFloat(raw);
        const h = variables.humidity_sensor ? parseFloat(states[variables.humidity_sensor]?.state) : NaN;
        const temp = isNaN(t) ? '--' : t.toFixed(1);
        const hum = isNaN(h) ? '' : `<span style="font-size: 13px; opacity: .7; margin-left: 6px;">${h.toFixed(0)}%</span>`;
        return `<span style="font-size: 2.4em; font-weight: 300; color: var(--catppuccin-text, #cad3f5);">${temp}°</span>${hum}`;
      ]]]
    title: |
      [[[
        const c = states[variables.climate];
        const on = c && !['off', 'unavailable', 'unknown'].includes(c.state);
        let status = '';
        if (on && variables.power_sensor) {
          const w = parseFloat(states[variables.power_sensor]?.state);
          if (!isNaN(w)) status = `⚡ ${w.toFixed(0)} W`;
        } else if (on && variables.energy_today_sensor) {
          const wh = parseFloat(states[variables.energy_today_sensor]?.state);
          if (!isNaN(wh)) status = `⚡ ${(wh / 1000).toFixed(1).replace('.', ',')} kWh hoje`;
        }
        // Good Sleep: end time in the status line; the progress bar along the bottom shows what's left
        if (on && ['sleep', 'wind_free_sleep'].includes(c?.attributes?.preset_mode)) {
          const endIso = states['sensor.ac_good_sleep_ends']?.attributes?.ends?.[variables.climate];
          const end = endIso ? new Date(endIso) : null;
          const mins = end ? Math.max(0, Math.round((end - Date.now()) / 60000)) : null;
          const left = mins === null ? null
            : mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)}h${mins % 60 ? String(mins % 60).padStart(2, '0') : ''}`;
          const sleep = left ? `⏾ ${left}` : '⏾ Bom sono';
          status = status ? `${status} · ${sleep}` : sleep;
        }
        if (!c || c.state === 'unavailable') status = 'indisponível';
        const name = states[variables.room]?.attributes?.friendly_name || '--';
        return `<div style="font-size: 14px; font-weight: 600; color: var(--catppuccin-text, #cad3f5);">${name}</div>
                <div style="font-size: 11px; color: var(--catppuccin-subtext0, #a5adcb); min-height: 14px;">${status}</div>`;
      ]]]
    # Good Sleep progress: full width at start, shrinking to the left as the AC approaches switch-off
    sleepbar: |
      [[[
        const info = states['sensor.ac_good_sleep_ends']?.attributes || {};
        const endIso = info.ends?.[variables.climate], startIso = info.starts?.[variables.climate];
        const c = states[variables.climate];
        if (!endIso || !startIso || !c || c.state === 'off') return '';
        const end = new Date(endIso), start = new Date(startIso);
        const left = Math.min(1, Math.max(0, (end - Date.now()) / (end - start)));
        return `<div style="height: 4px; background: rgba(202, 211, 245, 0.12);">
          <div style="height: 100%; width: ${(left * 100).toFixed(1)}%; background: var(--catppuccin-mauve, #c6a0f6);
                      border-radius: 0 2px 2px 0; transition: width 1s linear;"></div></div>`;
      ]]]
    graph:
      card:
        type: custom:mini-graph-card
        entities:
          - entity: "[[[ return variables.temp_sensor || variables.climate ]]]"
            attribute: "[[[ return variables.temp_sensor ? undefined : 'current_temperature' ]]]"
            color: "rgba(202, 211, 245, 0.25)"
        hours_to_show: 24
        points_per_hour: 1
        line_width: 0
        height: 70
        animate: true
        show:
          name: false
          icon: false
          state: false
          legend: false
          labels: false
          points: false
          fill: fade
        card_mod:
          style: |
            ha-card { background: none !important; border: none !important; box-shadow: none !important; }
    modes:
      card:
        type: custom:paper-buttons-row
        extra_styles: |
          @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
        styles:
          flex-wrap: nowrap
          gap: 0
        base_config:
          ripple: none
          layout: icon
          styles:
            button:
              width: 34px
              height: 34px
              padding: 0
              border-radius: 0
              background: "rgba(73, 77, 100, 0.85)"
            icon:
              color: "var(--catppuccin-text, #cad3f5)"
              --mdc-icon-size: 18px
        buttons:
          # Power: off -> cool @ 23 (script); on -> off; hold: always off (the state can be stale)
          - icon: mdi:power
            tap_action:
              action: call-service
              service: "[[[ return states[variables.climate]?.state === 'off' ? 'script.ac_turn_on' : 'climate.turn_off' ]]]"
              service_data:
                entity_id: "[[[ return variables.climate ]]]"
            hold_action:
              action: call-service
              service: climate.turn_off
              service_data:
                entity_id: "[[[ return variables.climate ]]]"
              haptic: heavy
            styles:
              button:
                border-radius: 50% 0 0 50%
                background: "[[[ return states[variables.climate]?.state && !['off','unavailable','unknown'].includes(states[variables.climate].state) ? 'var(--catppuccin-mauve, #c6a0f6)' : 'rgba(73, 77, 100, 0.85)' ]]]"
              icon:
                color: "[[[ return states[variables.climate]?.state && !['off','unavailable','unknown'].includes(states[variables.climate].state) ? 'var(--catppuccin-base, #24273a)' : 'var(--catppuccin-text, #cad3f5)' ]]]"
          - icon: mdi:snowflake
            tap_action:
              action: call-service
              service: climate.set_hvac_mode
              service_data:
                entity_id: "[[[ return variables.climate ]]]"
                hvac_mode: cool
            styles:
              button:
                background: "[[[ return states[variables.climate]?.state === 'cool' ? 'var(--catppuccin-mauve, #c6a0f6)' : 'rgba(73, 77, 100, 0.85)' ]]]"
              icon:
                color: "[[[ return states[variables.climate]?.state === 'cool' ? 'var(--catppuccin-base, #24273a)' : 'var(--catppuccin-text, #cad3f5)' ]]]"
          - icon: mdi:water-percent
            tap_action:
              action: call-service
              service: climate.set_hvac_mode
              service_data:
                entity_id: "[[[ return variables.climate ]]]"
                hvac_mode: dry
            styles:
              button:
                background: "[[[ return states[variables.climate]?.state === 'dry' ? 'var(--catppuccin-mauve, #c6a0f6)' : 'rgba(73, 77, 100, 0.85)' ]]]"
              icon:
                color: "[[[ return states[variables.climate]?.state === 'dry' ? 'var(--catppuccin-base, #24273a)' : 'var(--catppuccin-text, #cad3f5)' ]]]"
          # 4th button: WindFree (Samsung preset) or Eco (LG switch)
          - icon: "[[[ return variables.samsung ? 'mdi:weather-windy' : 'mdi:leaf' ]]]"
            tap_action:
              action: call-service
              service: "[[[ return variables.samsung ? 'climate.set_preset_mode' : 'switch.toggle' ]]]"
              service_data: |
                [[[
                  if (!variables.samsung) return { entity_id: variables.eco_switch };
                  const p = states[variables.climate]?.attributes?.preset_mode;
                  return { entity_id: variables.climate, preset_mode: p === 'wind_free' ? 'none' : 'wind_free' };
                ]]]
            styles:
              button:
                background: |
                  [[[
                    const active = variables.samsung
                      ? states[variables.climate]?.attributes?.preset_mode === 'wind_free'
                      : states[variables.eco_switch]?.state === 'on';
                    return active ? 'var(--catppuccin-green, #a6da95)' : 'rgba(73, 77, 100, 0.85)';
                  ]]]
              icon:
                color: |
                  [[[
                    const active = variables.samsung
                      ? states[variables.climate]?.attributes?.preset_mode === 'wind_free'
                      : states[variables.eco_switch]?.state === 'on';
                    return active ? 'var(--catppuccin-base, #24273a)' : 'var(--catppuccin-text, #cad3f5)';
                  ]]]
          # Fan: tap cycles fan_mode; hold toggles swing
          - icon: mdi:fan
            tap_action:
              action: call-service
              service: climate.set_fan_mode
              service_data: |
                [[[
                  const a = states[variables.climate]?.attributes || {};
                  const order = ['auto', 'low', 'medium', 'high', 'turbo'].filter(m => (a.fan_modes || []).includes(m));
                  const next = order[(order.indexOf(a.fan_mode) + 1) % order.length] || 'auto';
                  return { entity_id: variables.climate, fan_mode: next };
                ]]]
            hold_action:
              action: call-service
              service: climate.set_swing_mode
              service_data: |
                [[[
                  const s = states[variables.climate]?.attributes?.swing_mode;
                  const on = variables.samsung ? 'both' : 'on';
                  return { entity_id: variables.climate, swing_mode: s === 'off' ? on : 'off' };
                ]]]
            styles:
              button:
                border-radius: 0 50% 50% 0
              icon:
                animation: "[[[ const s = states[variables.climate]?.state; return s && !['off','unavailable','unknown'].includes(s) ? 'spin 2s linear infinite' : 'none' ]]]"
    target:
      card:
        type: custom:paper-buttons-row
        styles:
          flex-direction: column
          flex-wrap: nowrap
          gap: 0
        base_config:
          ripple: none
          styles:
            button:
              width: 40px
              height: 40px
              padding: 0
              border-radius: 0
              background: "rgba(73, 77, 100, 0.85)"
            icon:
              color: "var(--catppuccin-text, #cad3f5)"
            name:
              color: "var(--catppuccin-text, #cad3f5)"
              font-size: 14px
        buttons:
          - icon: mdi:chevron-up
            layout: icon
            tap_action:
              action: call-service
              service: climate.set_temperature
              service_data: |
                [[[
                  const a = states[variables.climate]?.attributes || {};
                  const base = typeof a.temperature === 'number' ? a.temperature : 23;
                  return { entity_id: variables.climate, temperature: Math.min(a.max_temp ?? 30, base + (a.target_temp_step || 1)) };
                ]]]
            styles:
              button:
                border-radius: 50% 50% 0 0
          - layout: name
            name: |
              [[[
                const t = states[variables.climate]?.attributes?.temperature;
                return typeof t === 'number' ? `${Math.round(t)}°` : '--';
              ]]]
          - icon: mdi:chevron-down
            layout: icon
            tap_action:
              action: call-service
              service: climate.set_temperature
              service_data: |
                [[[
                  const a = states[variables.climate]?.attributes || {};
                  const base = typeof a.temperature === 'number' ? a.temperature : 23;
                  return { entity_id: variables.climate, temperature: Math.max(a.min_temp ?? 16, base - (a.target_temp_step || 1)) };
                ]]]
            styles:
              button:
                border-radius: 0 0 50% 50%

# ==========================================================================
# Person card: avatar + status badge, phone chips, relative time
# ==========================================================================
person_card:
  template:
    - base_card
    - anim
  variables:
    person: ""
    presence: ""
    color: "var(--catppuccin-blue, #8aadf4)"
    phone: ""  # object-id prefix of the phone sensors, e.g. suellens_phone
  triggers_update: all
  show_name: false
  show_icon: false
  tap_action:
    action: more-info
    entity: "[[[ return variables.person ]]]"
  styles:
    card:
      - height: 100%
      - padding: 14px
    grid:
      - grid-template-areas: "'avatar status' 'chips chips' 'ago ago'"
      - grid-template-columns: 68px 1fr
      # sized by its content, with fixed gaps between avatar, chips and "há …"
      - grid-template-rows: 68px auto auto
      - row-gap: 12px
      - column-gap: 12px
    custom_fields:
      avatar:
        - position: relative
        - width: 64px
        - height: 64px
        - overflow: visible
      status:
        - justify-self: start
        - align-self: center
        - text-align: left
      chips:
        - justify-self: start
        - align-self: center
      ago:
        - justify-self: start
        - font-size: 12px
        - color: var(--catppuccin-subtext0,  #a5adcb)
  custom_fields:
    avatar: |
      [[[
        const p = states[variables.person];
        const presence = states[variables.presence]?.state;
        const home = presence ? ['Home', 'Just Arrived'].includes(presence) : p?.state === 'home';
        const badge = {
          'Just Arrived': ['mdi:home-import-outline', 'var(--catppuccin-green, #a6da95)'],
          'Home': ['mdi:home', 'var(--catppuccin-green, #a6da95)'],
          'Just Left': ['mdi:exit-run', 'var(--catppuccin-peach, #f5a97f)'],
          'Away': ['mdi:map-marker', 'var(--catppuccin-overlay1, #8087a2)'],
          'Extended Away': ['mdi:airplane', 'var(--catppuccin-overlay1, #8087a2)'],
        }[presence] || (home ? ['mdi:home', 'var(--catppuccin-green, #a6da95)'] : ['mdi:map-marker', 'var(--catppuccin-overlay1, #8087a2)']);
        const pic = p?.attributes?.entity_picture;
        const face = pic
          ? `<img src="${pic}" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover;">`
          : `<div style="width: 56px; height: 56px; border-radius: 50%; background: ${variables.color}; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--catppuccin-base, #24273a);">${(p?.attributes?.friendly_name || "?").charAt(0)}</div>`;
        const pulse = presence === 'Just Arrived' ? 'animation: pulse 1.6s ease-in-out infinite;' : '';
        return `<div style="position: relative; width: 64px; height: 64px;">
          <div style="position: absolute; left: 0; bottom: 0;">${face}</div>
          <div style="position: absolute; top: 0; right: 0; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%;
                      background: ${badge[1]}; border: 3px solid #2a2d40; display: flex; align-items: center; justify-content: center; ${pulse}">
            <ha-icon icon="${badge[0]}" style="--mdc-icon-size: 12px; color: var(--catppuccin-base, #24273a); display: flex;"></ha-icon>
          </div></div>`;
      ]]]
    status: |
      [[[
        const p = states[variables.person];
        const presence = states[variables.presence]?.state;
        const zone = p && !['home', 'not_home', 'unknown', 'unavailable'].includes(p.state) ? p.state : null;
        let text = {
          'Just Arrived': 'Acabou de chegar', 'Home': 'Em casa', 'Just Left': 'Acabou de sair',
          'Away': zone || 'Fora', 'Extended Away': 'Viajando',
        }[presence];
        if (!text) text = p?.state === 'home' ? 'Em casa' : (zone || 'Fora');
        return `<div style="font-size: 15px; font-weight: 700; color: var(--catppuccin-text, #cad3f5);">${p?.attributes?.friendly_name || ''}</div>
                <div style="font-size: 13px; margin-top: 2px; color: var(--catppuccin-subtext0, #a5adcb);">${text}</div>`;
      ]]]
    chips: |
      [[[
        const chip = (inner) => `<div style="display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 14px; background: rgba(73, 77, 100, 0.55); font-size: 12px; font-weight: 600; color: var(--catppuccin-text, #cad3f5);">${inner}</div>`;
        const icon = (i, c) => `<ha-icon icon="${i}" style="--mdc-icon-size: 16px; color: ${c};"></ha-icon>`;
        const out = [];
        const lvl = parseFloat(states[`sensor.${variables.phone}_battery_level`]?.state);
        if (!isNaN(lvl)) {
          const step = Math.round(lvl / 10) * 10;
          const bi = step >= 100 ? 'mdi:battery' : step < 10 ? 'mdi:battery-outline' : `mdi:battery-${step}`;
          const bc = lvl >= 50 ? 'var(--catppuccin-green, #a6da95)' : lvl >= 20 ? 'var(--catppuccin-yellow, #eed49f)' : 'var(--catppuccin-red, #ed8796)';
          out.push(chip(`${icon(bi, bc)}${Math.round(lvl)}%`));
        }
        const bs = states[`sensor.${variables.phone}_battery_state`]?.state;
        if (bs) {
          const charging = ['charging', 'full'].includes(bs);
          out.push(chip(icon(charging ? 'mdi:power-plug' : 'mdi:power-plug-off', charging ? 'var(--catppuccin-blue, #8aadf4)' : 'var(--catppuccin-overlay1, #8087a2)')));
        }
        const net = states[`sensor.${variables.phone}_network_type`]?.state;
        if (net && !['unknown', 'unavailable'].includes(net)) {
          out.push(chip(net === 'wifi'
            ? icon('mdi:wifi', 'var(--catppuccin-green, #a6da95)')
            : icon('mdi:signal-cellular-3', 'var(--catppuccin-red, #ed8796)')));
        }
        return `<div style="display: flex; gap: 6px;">${out.join('')}</div>`;
      ]]]
    ago: |
      [[[
        const s = states[variables.person];
        if (!s) return '';
        const sec = Math.max(0, (Date.now() - new Date(s.last_updated).getTime()) / 1000);
        const unit = (n, one, many) => `há ${n} ${n === 1 ? one : many}`;
        if (sec < 10) return 'agora';
        if (sec < 60) return unit(Math.floor(sec), 'segundo', 'segundos');
        if (sec < 3600) return unit(Math.floor(sec / 60), 'minuto', 'minutos');
        if (sec < 86400) return unit(Math.floor(sec / 3600), 'hora', 'horas');
        return unit(Math.floor(sec / 86400), 'dia', 'dias');
      ]]]

# ==========================================================================
# Small tile: round icon cell + big label + small sublabel
# ==========================================================================
tile:
  template:
    - base_card
    - anim
  variables:
    icon: mdi:help
    label: ""
    sublabel: ""
    accent: "var(--catppuccin-mauve, #c6a0f6)"
    active: false
    animation: none
    # Optional quick-action button on the right (the tile's own tap opens its pop-up): a tap_action
    # config, and its icon. Without an action the button is hidden.
    action: null
    action_icon: mdi:gesture-tap
    # Filled (in action_accent, else the tile's accent), e.g. a dose already taken
    action_active: false
    action_accent: null
  show_name: false
  show_icon: false
  show_label: false
  show_state: false
  styles:
    card:
      - height: 100%
      - padding: 14px 16px  # clear of the 24px rounded corners
      - animation: "[[[ return variables.animation ]]]"
    # Icon and quick button on top, text across the whole tile below
    grid:
      - grid-template-areas: "'badge action' 'text text'"
      - grid-template-columns: 1fr auto
      - grid-template-rows: auto 1fr
      - row-gap: 4px
    custom_fields:
      badge:
        - justify-self: start
      text:
        - justify-self: stretch
        - min-width: 0
      action:
        - display: "[[[ return variables.action ? 'block' : 'none' ]]]"
  # Own markup for icon and text: button-card's icon sizes wrongly in hidden tabs, and its label/name
  # styling didn't match the other custom-markup cards.
  custom_fields:
    badge: |
      [[[
        const bg = variables.active ? variables.accent : 'rgba(73, 77, 100, 0.6)';
        const fg = variables.active ? 'var(--catppuccin-base, #24273a)' : 'var(--catppuccin-text, #cad3f5)';
        return `<div style="width: 36px; height: 36px; border-radius: 50%; background: ${bg}; display: flex; align-items: center; justify-content: center;">
          <ha-icon icon="${variables.icon}" style="--mdc-icon-size: 18px; color: ${fg};"></ha-icon></div>`;
      ]]]
    text: |
      [[[
        const line = 'white-space: nowrap; overflow: hidden; text-overflow: ellipsis;';
        return `<div style="text-align: left;">
          <div style="font-size: 15px; font-weight: 600; color: var(--catppuccin-text, #cad3f5); ${line}">${variables.label}</div>
          <div style="font-size: 12px; margin-top: 3px; color: var(--catppuccin-subtext0, #a5adcb); ${line}">${variables.sublabel}</div></div>`;
      ]]]
    action:
      card:
        type: custom:paper-buttons-row
        buttons:
          - icon: "[[[ return variables.action_icon ]]]"
            layout: icon
            ripple: none
            tap_action: "[[[ return variables.action ]]]"
            styles:
              button:
                width: 34px
                height: 34px
                padding: 0
                border-radius: 50%
                background: "[[[ return variables.action_active ? (variables.action_accent || variables.accent) : 'rgba(73, 77, 100, 0.85)' ]]]"
