    active: "[[[ return entity?.state === 'on' ]]]"
    accent: "var(--catppuccin-yellow, #eed49f)"
  styles:
    card:
      - height: 110px  # the tiles' height on Casa
  custom_fields:
    # the icon is the switch; tapping the rest of the card opens the entity
    badge:
      card:
        type: custom:paper-buttons-row
        buttons:
          - entity: "[[[ return entity.entity_id ]]]"
            icon: "[[[ return variables.icon ]]]"
            layout: icon
            ripple: none
            tap_action:
              action: toggle
              haptic: light
            styles:
              button:
                width: 36px
                height: 36px
                padding: 0
                border-radius: 50%
                background: "[[[ return variables.active ? variables.accent : 'rgba(73, 77, 100, 0.6)' ]]]"
