    icon: "[[[ return entity?.state === 'on' ? 'mdi:lightbulb-on' : 'mdi:lightbulb-outline' ]]]"
    label: "[[[ return entity?.state === 'on' ? 'Acesa' : entity?.state === 'off' ? 'Apagada' : '--' ]]]"
    sublabel: |
      [[[
        const reg = hass.entities?.[entity?.entity_id];
        const areaId = reg?.area_id || hass.devices?.[reg?.device_id]?.area_id;
        const area = hass.areas?.[areaId]?.name || '';
        return [area, variables.detail].filter(Boolean).join(' · ');
