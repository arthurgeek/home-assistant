      - overflow: hidden
      - box-sizing: border-box
      - background: |
          [[[
            const on = (variables.lights || []).some((id) => states[id]?.state === 'on');
            return on ? 'linear-gradient(135deg, rgba(238, 212, 159, 0.16), rgba(36, 39, 58, 0.75))' : 'rgba(36, 39, 58, 0.7)';
          ]]]
    grid:
      - grid-template-areas: "'title btn' 'status btn' '. btn'"
      - grid-template-columns: 1fr min-content
      - grid-template-rows: min-content min-content 1fr
    custom_fields:
      circle:
        - position: absolute
        - left: -30px
        - bottom: -30px
        - pointer-events: none
      title:
        - justify-self: start
        - text-align: left
        - font-size: 16px
        - font-weight: 600
        - color: var(--catppuccin-text,  #cad3f5)
        - z-index: 1
      status:
        - justify-self: start
        - z-index: 1
      btn:
        - align-self: start
        - z-index: 1
  custom_fields:
    # Own markup instead of button-card's icon: that one sizes wrongly when rendered in a hidden tab.
    circle: |
      [[[
        return `<div style="width: 100px; height: 100px; border-radius: 50%; background: ${variables.circle_color}; opacity: 0.85;
                            display: flex; align-items: center; justify-content: center;">
          <ha-icon icon="${variables.icon}" style="--mdc-icon-size: 46px; color: var(--catppuccin-base, #24273a); opacity: 0.7; margin: -18px 0 0 18px;"></ha-icon></div>`;
      ]]]
    title: "[[[ return states[variables.room]?.attributes?.friendly_name || '--' ]]]"
    status: |
      [[[
        const parts = [];
        const lights = variables.lights || [];
        if (lights.length) {
          const n = lights.filter((id) => states[id]?.state === 'on').length;
          const color = n ? 'var(--catppuccin-yellow, #eed49f)' : 'var(--catppuccin-overlay1, #8087a2)';
          parts.push(`<span style="display: inline-flex; align-items: flex-start;">
            <ha-icon icon="mdi:lightbulb-group" style="--mdc-icon-size: 15px; color: ${color};"></ha-icon>
            ${n ? `<sup style="font-size: 10px; font-weight: 700; color: ${color}; margin-left: 1px;">${n}</sup>` : ''}</span>`);
        }
        const raw = variables.temp_sensor ? states[variables.temp_sensor]?.state
          : variables.climate ? states[variables.climate]?.attributes?.current_temperature : undefined;
        if (raw !== undefined) {
          const t = parseFloat(raw);
          parts.push(`<span style="display: inline-flex; align-items: center; gap: 2px;">
            <ha-icon icon="mdi:thermometer" style="--mdc-icon-size: 15px; color: var(--catppuccin-sapphire, #7dc4e4);"></ha-icon>
            <span style="font-size: 12px; font-weight: 600; color: var(--catppuccin-text, #cad3f5);">${isNaN(t) ? '--' : t.toFixed(1)}°</span></span>`);
        }
        if (variables.presence) {
          const here = states[variables.presence]?.state === 'on';
          parts.push(`<ha-icon icon="${here ? 'mdi:account' : 'mdi:account-outline'}" title="${here ? 'Presença' : 'Vazio'}"
            style="--mdc-icon-size: 15px; color: ${here ? 'var(--catppuccin-green, #a6da95)' : 'var(--catppuccin-overlay1, #8087a2)'};"></ha-icon>`);
        }
        if (variables.subtitle) {
          parts.push(`<span style="font-size: 12px; color: var(--catppuccin-subtext0, #a5adcb);">${variables.subtitle}</span>`);
        }
        return `<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">${parts.join('')}</div>`;
      ]]]
    btn:
      card:
        type: custom:paper-buttons-row
        styles:
          flex-direction: column
          flex-wrap: nowrap
          gap: 8px
        buttons: |
          [[[
            const activeStates = ['on', 'open', 'playing', 'cool', 'dry', 'heat', 'auto', 'fan_only', 'heat_cool'];
            const list = variables.buttons || [];
            if (!list.length) return [{ layout: 'icon', icon: 'mdi:circle-small', styles: { button: { display: 'none' } } }];
            return list.map((b) => {
              const st = states[b.entity]?.state;
              const active = activeStates.includes(st);
              let tap;
              if (b.kind === 'ac') {
                tap = { action: 'call-service', service: st === 'off' ? 'script.ac_turn_on' : 'climate.turn_off',
                        service_data: { entity_id: b.entity } };
              } else if (b.kind === 'press') {
                tap = { action: 'call-service', service: 'button.press', service_data: { entity_id: b.press_entity },
                        confirmation: { text: 'Destrancar a porta?' } };
              } else {
                tap = { action: 'toggle' };
              }
              // an AC: hold always turns it off (the state can be stale)
              const hold = b.kind === 'ac'
                ? { action: 'call-service', service: 'climate.turn_off', service_data: { entity_id: b.entity }, haptic: 'heavy' }
                : { action: 'more-info' };
              return {
                entity: b.entity, icon: b.icon, layout: 'icon', ripple: 'circle',
                tap_action: tap, hold_action: hold,
                styles: {
                  button: { width: '40px', height: '40px', padding: '0', 'border-radius': '50%',
                            background: active ? 'var(--catppuccin-yellow, #eed49f)' : 'rgba(73, 77, 100, 0.7)' },
                  icon: { color: active ? 'var(--catppuccin-base, #24273a)' : 'var(--catppuccin-text, #cad3f5)',
                          '--mdc-icon-size': '20px' },
                },
              };
            });
          ]]]

# ==========================================================================
# AC option row (Modo / Recursos / Ventilação / Direção do ar): one button per value the AC itself
# reports (hvac_modes, preset_modes, fan_modes, swing_modes); hidden when the AC has none.
# ==========================================================================
ac_options:
  variables:
    climate: ""
    attribute: hvac_mode
    popup_key: ""
    rows:
      hvac_mode:
        list: hvac_modes
        title: Modo
        icon: mdi:power-settings
        service: climate.set_hvac_mode
        order: ["off", cool, dry, fan_only, heat, auto, heat_cool]
        values:
          "off": [Desligado, 'mdi:power']
          cool: [Resfriar, 'mdi:snowflake']
          dry: [Desumidificar, 'mdi:water-percent']
          fan_only: [Ventilar, 'mdi:fan']
          heat: [Aquecer, 'mdi:fire']
          auto: [Auto, 'mdi:thermostat-auto']
          heat_cool: [Auto, 'mdi:thermostat-auto']
      preset_mode:
        list: preset_modes
        title: Recursos
        icon: mdi:tune-variant
        service: climate.set_preset_mode
        order: [none, wind_free, sleep, wind_free_sleep, quiet, boost, smart]
        values:
          none: [Normal, 'mdi:circle-outline']
          wind_free: [WindFree, 'mdi:weather-windy']
          sleep: [Sono, 'mdi:sleep']
          wind_free_sleep: [WindFree Sono, 'mdi:weather-night']
          quiet: [Silencioso, 'mdi:volume-low']
          boost: [Turbo, 'mdi:rocket-launch']
          smart: [Inteligente, 'mdi:brain']
      fan_mode:
        list: fan_modes
        title: Ventilação
        icon: mdi:fan
        service: climate.set_fan_mode
        order: [auto, low, medium, high, turbo]
        values:
          auto: [Auto, 'mdi:fan-auto']
          low: [Baixo, 'mdi:fan-speed-1']
          medium: [Médio, 'mdi:fan-speed-2']
          high: [Alto, 'mdi:fan-speed-3']
          turbo: [Turbo, 'mdi:fan-plus']
      swing_mode:
        list: swing_modes
        title: Direção do ar
        icon: mdi:arrow-all
        service: climate.set_swing_mode
        order: ["off", "on", vertical, horizontal, both]
        values:
          "off": [Parado, 'mdi:arrow-collapse-vertical']
          "on": [Oscilar, 'mdi:arrow-up-down']
          vertical: [Vertical, 'mdi:arrow-up-down']
          horizontal: [Horizontal, 'mdi:arrow-left-right']
          both: [Ambos, 'mdi:arrow-all']
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - border: none
      - padding: 4px 0
      - display: |
          [[[ return (states[variables.climate]?.attributes?.[variables.rows[variables.attribute].list] || []).length ? 'block' : 'none'; ]]]
    grid:
      - grid-template-areas: "'title' 'row'"
      - row-gap: 10px
    custom_fields:
      title:
        - justify-self: stretch
  custom_fields:
    title: |
      [[[
        const row = variables.rows[variables.attribute];
        return `<div style="display: flex; align-items: center; gap: 16px; color: var(--catppuccin-text, #cad3f5);">
          <ha-icon icon="${row.icon}" style="--mdc-icon-size: 24px;"></ha-icon>
          <span style="font-size: 18px; font-weight: 600; white-space: nowrap;">${row.title}</span>
          <span style="flex: 1; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.18);"></span></div>`;
      ]]]
    row:
      card:
        type: custom:paper-buttons-row
        styles:
          flex-wrap: wrap
          gap: 8px
          justify-content: flex-start
        buttons: |
          [[[
            const row = variables.rows[variables.attribute];
            const c = states[variables.climate];
            const current = variables.attribute === 'hvac_mode' ? c?.state : c?.attributes?.[variables.attribute];
            const rank = (v) => { const i = row.order.indexOf(v); return i === -1 ? 99 : i; };
            const list = [...(c?.attributes?.[row.list] || [])].sort((a, b) => rank(a) - rank(b));
            if (!list.length) return [{ layout: 'icon', icon: 'mdi:circle-small', styles: { button: { display: 'none' } } }];
            return list.map((value) => {
              const active = current === value;
              const [label, icon] = row.values[value] || [value, 'mdi:circle-medium'];
              // WindFree Sleep asks for Good Sleep's duration first (chooser pop-up)
              const tap = variables.attribute === 'preset_mode' && value === 'wind_free_sleep' && variables.popup_key
                ? { action: 'navigate', navigation_path: `#ac_${variables.popup_key}_sleep` }
                : { action: 'call-service', service: row.service,
                    service_data: { entity_id: variables.climate, [variables.attribute]: value } };
              return {
                name: label, icon, layout: 'icon|name', ripple: 'none', tap_action: tap,
                styles: {
                  button: { padding: '8px 14px', 'border-radius': '18px',
                            background: active ? 'var(--catppuccin-mauve, #c6a0f6)' : 'rgba(73, 77, 100, 0.6)' },
                  name: { 'font-size': '13px', color: active ? 'var(--catppuccin-base, #24273a)' : 'var(--catppuccin-text, #cad3f5)' },
                  icon: { color: active ? 'var(--catppuccin-base, #24273a)' : 'var(--catppuccin-text, #cad3f5)' },
                },
              };
            });
          ]]]

# ==========================================================================
# Good Sleep extension row (AC pop-up): buttons that add time, shown only while the AC runs Good Sleep
# ==========================================================================
ac_sleep_extend:
  variables:
    climate: ""
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - border: none
      - padding: 4px 0
      - display: |
          [[[ return states['sensor.ac_good_sleep_ends']?.attributes?.ends?.[variables.climate] ? 'block' : 'none'; ]]]
    grid:
      - grid-template-areas: "'title' 'row'"
      - row-gap: 10px
    custom_fields:
      title:
        - justify-self: stretch
  custom_fields:
    title: |
      [[[
        return `<div style="display: flex; align-items: center; gap: 16px; color: var(--catppuccin-text, #cad3f5);">
          <ha-icon icon="mdi:timer-plus-outline" style="--mdc-icon-size: 24px;"></ha-icon>
          <span style="font-size: 18px; font-weight: 600; white-space: nowrap;">Prolongar o sono</span>
          <span style="flex: 1; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.18);"></span></div>`;
      ]]]
    row:
      card:
        type: custom:paper-buttons-row
        styles:
          flex-wrap: wrap
          gap: 8px
          justify-content: flex-start
        buttons: |
          [[[
            return [[0.5, '+30 min'], [1, '+1 h'], [2, '+2 h']].map(([hours, label]) => ({
              name: label, icon: 'mdi:timer-plus-outline', layout: 'icon|name', ripple: 'none',
              tap_action: { action: 'call-service', service: 'script.ac_good_sleep_extend',
                            service_data: { entity_id: variables.climate, hours }, haptic: 'success' },
              styles: {
                button: { padding: '8px 14px', 'border-radius': '18px', background: 'rgba(73, 77, 100, 0.6)' },
                name: { 'font-size': '13px', color: 'var(--catppuccin-text, #cad3f5)' },
                icon: { color: 'var(--catppuccin-text, #cad3f5)' },
              },
            }));
          ]]]

# Renders nothing: default for optional card slots in streamline templates.
nothing:
  show_name: false
  show_icon: false
  styles:
    card:
      - display: none
