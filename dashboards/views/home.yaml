title: Home
path: home
icon: mdi:home
type: custom:grid-layout
layout:
  grid-template-columns: "minmax(0, 500px)"
  justify-content: center
  padding: 0 8px 110px 8px
  mediaquery:
    "(min-width: 900px)":
      grid-template-columns: "minmax(0, 1100px)"
      padding: 0 24px 110px 24px
cards:
  # ========================================================
  # POPUPS (Bubble Card, opened by #hash)
  # ========================================================
  - !include ../popups/lights.yaml
  - !include ../popups/climate.yaml
  - !include ../popups/media.yaml
  - !include ../popups/vacuum.yaml
  - !include ../popups/calendar.yaml
  - !include ../popups/weather.yaml
  - !include ../popups/todo.yaml
  - !include ../popups/doorbell.yaml
  - type: vertical-stack
    cards: !include_dir_list ../popups/rooms
  - type: vertical-stack
    cards: !include_dir_list ../popups/ac

  # ========================================================
  # HEADER (greeting + sentence with tappable pills)
  # ========================================================
  - !include header.yaml

  # ========================================================
  # TABS
  # ========================================================
  - type: custom:simple-tabs
    tabs_alignment: start
    remember_tab: per_device
    enable_swipe: true
    swipe_animation: true
    tab_click_animation: true
    pre-load: true
    card_padding: "0"
    tabs_gap: 6px
    button_padding: 6px 14px
    button_background: transparent
    button_border_color: "var(--catppuccin-surface1, #494d64)"
    button_text_color: "var(--catppuccin-subtext0, #a5adcb)"
    button_hover_color: "var(--catppuccin-text, #cad3f5)"
    button_active_background: "var(--catppuccin-mauve, #c6a0f6)"
    button_active_text_color: "var(--catppuccin-base, #24273a)"
    tabs:
      - title: Casa
        card: !include tabs/home.yaml
      - title: Térreo
        card: !include tabs/ground_floor.yaml
      - title: Superior
        card: !include tabs/upper_floor.yaml
      - title: Externo
        card: !include tabs/outside.yaml

  # ========================================================
  # FLOATING NAVBAR
  # ========================================================
  - !include navbar.yaml
