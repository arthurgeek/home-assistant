type: custom:layout-card
layout_type: custom:grid-layout
layout:
  # minmax(0, 1fr): a carousel's natural width (all its pages) must not widen its column
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
  grid-template-rows: auto auto 110px 110px 110px auto
  grid-gap: 10px
  margin: 8px 0 0 0
  grid-template-areas: |
    "arthur suellen"
    "ac ac"
    "events door"
    "events alarm"
    "todo meds"
    "feed feed"
  mediaquery:
    "(min-width: 900px)":
      grid-template-columns: repeat(4, minmax(0, 1fr))
      # media + ACs on the left half; people and tiles beside them, the events card taking the remaining height
      # the events row (4) is the flexible one, so a tall media + ACs column grows only it
      # row 1: the whole AC carousel (160px card, as tall as the people cards, + 26px of markers), so the markers
      # stay with the AC card and get the row gap below them; row 4: at least the markers of the agenda under the
      # ACs (desktop without music)
      grid-template-rows: 186px 110px 110px minmax(16px, 1fr) auto
      grid-template-areas: |
        "ac ac arthur suellen"
        "ac ac door alarm"
        "ac ac todo meds"
        "ac ac events events"
        "feed feed feed feed"
cards:
  # --- People ---------------------------------------------------------------
  - type: custom:button-card
    template: person_card
    view_layout:
      grid-area: arthur
      place-self: start stretch  # its natural 160px, level with the AC card, not the taller desktop row
    variables:
      person: person.arthur
      presence: input_select.presence_state_arthur
      color: "var(--catppuccin-blue, #8aadf4)"
      phone: arthur_s_phone_arthurs_phone

  - type: custom:button-card
    template: person_card
    view_layout:
      grid-area: suellen
      place-self: start stretch  # its natural 160px, level with the AC card, not the taller desktop row
    variables:
      person: person.suellen
      presence: input_select.presence_state_suellen
      color: "var(--catppuccin-pink, #f5bde6)"
      phone: suellens_phone

  # --- Main door: tap unlocks, hold opens the door pop-up -------------------------
  - type: custom:button-card
    template: tile
    view_layout:
      grid-area: door
    # last access from the UniFi Access log (the door has no position sensor)
    entity: sensor.main_door_log
    variables:
      icon: mdi:door-closed-lock
      label: |
        [[[
          const t = new Date(entity?.state);
          if (isNaN(t)) return 'Trancada';
          const min = Math.floor((Date.now() - t) / 60000);
          if (min < 1) return 'Agora';
          if (min < 60) return `há ${min} min`;
          const h = Math.floor(min / 60);
          return h < 24 ? `há ${h} h` : t.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' });
        ]]]
      sublabel: "[[[ const e = entity?.attributes?.entries?.[0]; return e ? `Porta da sala · ${e.who}` : 'Porta da sala' ]]]"
      accent: "var(--catppuccin-peach, #f5a97f)"
      action_icon: mdi:lock-open-variant
      # call-service, not perform-action: the quick button is a paper-buttons-row
      action:
        action: call-service
        service: button.press
        service_data:
          entity_id: button.main_door_unlock
        confirmation:
          text: Destrancar a porta?
        haptic: success
    tap_action:
      action: navigate
      navigation_path: "#main_door"

  # --- Now playing (while music plays) above the ACs (swipe) ---------------------
  - type: vertical-stack
    view_layout:
      grid-area: ac
    cards:
      # Now playing: first on Casa while any speaker plays (the card follows the playing group); hidden otherwise
      - type: conditional
        conditions:
          - condition: or
            conditions: &playing
              - condition: state
                entity: media_player.living_room_speaker
                state: playing
              - condition: state
                entity: media_player.kids_bedroom_speaker
                state: playing
              - condition: state
                entity: media_player.sonos_move_speaker
                state: playing
        card:
          type: custom:streamline-card
          template: sonos
      - !include home_acs.yaml

  # --- Agenda (swipe) --------------------------------------------------------------
  # Phone: its own cell
  - type: custom:button-card
    template: events_carousel
    view_layout:
      grid-area: events
      show:
        mediaquery: "(max-width: 899px)"
  # Desktop while music plays: its own cell, ending level with the media + ACs column
  - type: custom:button-card
    template: events_carousel
    variables:
      while_music: true
    view_layout:
      grid-area: events
      show:
        mediaquery: "(min-width: 900px)"
  # Desktop without music: the ACs alone are much shorter than the people and tiles beside them, so the agenda
  # takes the space under them, its frame level with the door/alarm and to-do/meds tiles. Those are 12px shorter
  # than their 110px rows, so they span 98 + 10 + 12 + 98 = 218px; plus the agenda's 26px of markers, which hang
  # into row 4. Aligned to the top, not stretched: hidden (while music plays) it then covers nothing
  - type: custom:button-card
    template: events_carousel
    variables:
      while_music: false
    view_layout:
      grid-area: 2 / 1 / 5 / 3
      place-self: start stretch
      show:
        mediaquery: "(min-width: 900px)"
    styles:
      card:
        - height: 244px

  # --- Alarm: tap more-info (arm/disarm), hold opens the alarm pop-up ---------------
  - type: custom:button-card
    template: tile
    view_layout:
      grid-area: alarm
    entity: alarm_control_panel.home
    variables:
      icon: |
        [[[
          return {disarmed: 'mdi:shield-off-outline', armed_away: 'mdi:shield-lock', armed_home: 'mdi:shield-home',
                  armed_night: 'mdi:shield-moon', triggered: 'mdi:bell-ring'}[entity?.state] || 'mdi:shield-sync';
        ]]]
      label: |
        [[[
          return {disarmed: 'Desarmado', armed_away: 'Armado', armed_home: 'Armado (casa)', armed_night: 'Armado (noite)',
                  arming: 'Armando…', pending: 'Pendente', triggered: 'DISPARADO'}[entity?.state] || '--';
        ]]]
      sublabel: Alarme
      active: "[[[ return entity?.state !== 'disarmed' ]]]"
      accent: "var(--catppuccin-red, #ed8796)"
      animation: "[[[ return entity?.state === 'triggered' ? 'pulse-red 1s ease-in-out infinite' : 'none' ]]]"
      # Toggle: disarmed arms in Casa mode, armed disarms; both confirmed.
      action_icon: "[[[ return entity?.state === 'disarmed' ? 'mdi:shield-home' : 'mdi:shield-off-outline' ]]]"
      action: |
        [[[
          return entity?.state === 'disarmed'
            ? { action: 'call-service', service: 'alarm_control_panel.alarm_arm_home',
                service_data: { entity_id: 'alarm_control_panel.home' },
                confirmation: { text: 'Armar o alarme em modo Casa?' }, haptic: 'success' }
            : { action: 'call-service', service: 'alarm_control_panel.alarm_disarm',
                service_data: { entity_id: 'alarm_control_panel.home' },
                confirmation: { text: 'Desarmar o alarme?' }, haptic: 'success' };
        ]]]
    tap_action:
      action: navigate
      navigation_path: "#alarm"

  # --- Meds: current dose; tap marks it taken -----------------------------------------
  - type: custom:button-card
    template: tile
    view_layout:
      grid-area: meds
    entity: sensor.meds
    variables:
      icon: "[[[ return entity?.state === 'taken' ? 'mdi:pill' : 'mdi:pill-multiple' ]]]"
      label: |
        [[[
          const s = entity?.state, a = entity?.attributes || {};
          const hhmm = (iso) => iso ? new Date(iso).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}) : '';
          if (s === 'taken') return `Tomado ${hhmm(a.taken_at)}`;
          if (s === 'pending') return 'Pendente';
          if (s === 'upcoming') return `Às ${hhmm(a.due)}`;
          return '--';
        ]]]
      sublabel: "[[[ return entity?.attributes?.dose === 'morning' ? 'Remédio da manhã' : 'Remédio da noite' ]]]"
      active: "[[[ return entity?.state === 'pending' ]]]"
      accent: "var(--catppuccin-yellow, #eed49f)"
      animation: "[[[ return entity?.state === 'pending' ? 'pulse 2s ease-in-out infinite' : 'none' ]]]"
      # Quick "taken" button: unfilled and marks the dose while pending; filled green and inert once taken
      # (call-service: the button is a paper-buttons-row)
      action_icon: mdi:check
      action_active: "[[[ return entity?.state === 'taken' ]]]"
      action_accent: "var(--catppuccin-green, #a6da95)"
      action: |
        [[[
          return entity?.state === 'taken' ? { action: 'none' }
            : { action: 'call-service', service: 'script.meds_taken',
                confirmation: { text: 'Marcar o remédio como tomado?' }, haptic: 'success' };
        ]]]
    tap_action:
      action: navigate
      navigation_path: "#meds"

  # --- To-do: open items across the three local lists ------------------------------
  - type: custom:button-card
    template: tile
    view_layout:
      grid-area: todo
    triggers_update:
      - todo.house_projects
      - todo.quick_tasks
      - todo.personal
    variables:
      icon: mdi:checkbox-marked-outline
      label: |
        [[[
          const n = ['todo.house_projects', 'todo.quick_tasks', 'todo.personal']
            .reduce((sum, id) => sum + (parseInt(states[id]?.state) || 0), 0);
          return n === 0 ? 'Nada pendente' : n === 1 ? '1 tarefa' : `${n} tarefas`;
        ]]]
      sublabel: Projetos · Rápidas · Pessoal
    tap_action:
      action: navigate
      navigation_path: "#todo"

  # --- Feed: live activity rows (each only while active) + weather -------------------
  - type: vertical-stack
    view_layout:
      grid-area: feed
    cards:
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.low_batteries
            above: 0
        card:
          type: custom:button-card
          template: active_row
          variables:
            icon: mdi:battery-alert
            title: Bateria baixa
            accent: "linear-gradient(135deg, rgba(237, 135, 150, 0.85), rgba(245, 169, 127, 0.85))"
            subtitle: |
              [[[
                const devices = states['sensor.low_batteries']?.attributes?.devices || [];
                return devices.map((d) => `${d.name} ${d.level}%`).join(' · ');
              ]]]
          tap_action:
            action: navigate
            navigation_path: "#todo"

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.washer_current_status
            state_not: [power_off, end, unknown, unavailable]
        card:
          type: custom:button-card
          template: active_row
          variables:
            icon: mdi:washing-machine
            title: Lavadora
            animation: spin 2s linear infinite
            subtitle: |
              [[[
                const end = new Date(states['sensor.washer_remaining_time']?.state);
                if (isNaN(end)) return 'Lavando';
                const min = Math.max(0, Math.round((end - Date.now()) / 60000));
                const pad = (n) => String(n).padStart(2, '0');
                return `${Math.floor(min / 60)}:${pad(min % 60)} restantes · termina ${pad(end.getHours())}:${pad(end.getMinutes())}`;
              ]]]
          tap_action:
            action: none

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.dryer_current_status
            state_not: [power_off, end, unknown, unavailable]
        card:
          type: custom:button-card
          template: active_row
          variables:
            icon: mdi:tumble-dryer
            title: Secadora
            animation: spin 2s linear infinite
            accent: "linear-gradient(135deg, rgba(138, 173, 244, 0.85), rgba(125, 196, 228, 0.85))"
            subtitle: |
              [[[
                const end = new Date(states['sensor.dryer_remaining_time']?.state);
                if (isNaN(end)) return 'Secando';
                const min = Math.max(0, Math.round((end - Date.now()) / 60000));
                const pad = (n) => String(n).padStart(2, '0');
                return `${Math.floor(min / 60)}:${pad(min % 60)} restantes · termina ${pad(end.getHours())}:${pad(end.getMinutes())}`;
              ]]]
          tap_action:
            action: none

      - type: conditional
        conditions:
          - condition: state
            entity: vacuum.roborock
            state_not: [docked, unavailable, unknown]
        card:
          type: custom:button-card
          template: active_row
          variables:
            icon: mdi:robot-vacuum
            title: Roborock
            animation: shake 1.2s ease-in-out infinite
            accent: "linear-gradient(135deg, rgba(166, 218, 149, 0.85), rgba(139, 213, 202, 0.85))"
            subtitle: |
              [[[
                const st = {cleaning: 'Limpando', returning: 'Voltando para a base', paused: 'Pausado',
                            idle: 'Parado', error: 'Erro'}[states['vacuum.roborock']?.state] || states['vacuum.roborock']?.state;
                const bat = states['sensor.roborock_qrevo_curv_series_battery']?.state;
                return `${st} · ${bat ?? '--'}%`;
              ]]]
          tap_action:
            action: navigate
            navigation_path: "#vacuum"

      - type: custom:weather-forecast-card
        entity: weather.home
        show_current: true
        show_forecast: true
        default_forecast: hourly
        forecast_types: hourly
        show_condition_effects: true
        show_attributes: false
        tap_action:
          action: navigate
          navigation_path: "#weather"
        forecast:
          mode: simple
          hourly_slots: 12
          show_sun_times: true
        card_mod:
          style: |-
            ha-card { background: rgba(36, 39, 58, 0.7); border-radius: 24px; border: 1px solid rgba(202, 211, 245, 0.08); }
