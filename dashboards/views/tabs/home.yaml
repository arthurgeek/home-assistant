type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: 1fr 1fr
  grid-template-rows: 150px 186px 70px 70px 70px auto
  grid-gap: 10px
  margin: 8px 0 0 0
  grid-template-areas: |
    "arthur suellen"
    "ac ac"
    "events door"
    "events alarm"
    "events todo"
    "feed feed"
  mediaquery:
    "(min-width: 900px)":
      grid-template-columns: 1fr 1fr 1fr 1fr
      grid-template-rows: 186px 70px 70px 70px auto
      grid-template-areas: |
        "ac ac arthur suellen"
        "events door feed feed"
        "events alarm feed feed"
        "events todo feed feed"
        ". . feed feed"
cards:
  # --- People ---------------------------------------------------------------
  - type: custom:button-card
    template: person_card
    view_layout:
      grid-area: arthur
    variables:
      person: person.arthur
      presence: input_select.presence_state_arthur
      color: "var(--catppuccin-blue, #8aadf4)"
      phone: arthur_s_phone_arthurs_phone

  - type: custom:button-card
    template: person_card
    view_layout:
      grid-area: suellen
    variables:
      person: person.suellen
      presence: input_select.presence_state_suellen
      color: "var(--catppuccin-pink, #f5bde6)"
      phone: suellens_phone

  # --- Main door: tap unlocks, hold opens the door pop-up -------------------------
  - type: custom:button-card
    template: tile
    view_layout:
      grid-area: door
    entity: binary_sensor.main_door
    variables:
      icon: "[[[ return entity?.state === 'on' ? 'mdi:door-open' : 'mdi:door-closed-lock' ]]]"
      label: "[[[ return entity?.state === 'on' ? 'Aberta' : entity?.state === 'off' ? 'Fechada' : '--' ]]]"
      sublabel: Porta da sala
      active: "[[[ return entity?.state === 'on' ]]]"
      accent: "var(--catppuccin-peach, #f5a97f)"
      animation: "[[[ return entity?.state === 'on' ? 'pulse 2s ease-in-out infinite' : 'none' ]]]"
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.main_door_unlock
      confirmation:
        text: Destrancar a porta?
      haptic: success
    hold_action:
      action: navigate
      navigation_path: "#main_door"

  # --- ACs (swipe) ---------------------------------------------------------------
  - type: vertical-stack
    view_layout:
      grid-area: ac
    cards:
      - !include home_acs.yaml

  # --- Agenda (swipe) --------------------------------------------------------------
  - type: custom:button-card
    template: events_carousel
    view_layout:
      grid-area: events
    tap_action:
      action: navigate
      navigation_path: "#calendar"

  # --- Alarm: tap more-info (arm/disarm), hold opens the alarm pop-up ---------------
  - type: custom:button-card
    template: tile
    view_layout:
      grid-area: alarm
    entity: alarm_control_panel.home
    variables:
      icon: |
        [[[
          return {disarmed: 'mdi:shield-off-outline', armed_away: 'mdi:shield-lock', armed_home: 'mdi:shield-home',
                  armed_night: 'mdi:shield-moon', triggered: 'mdi:bell-ring'}[entity?.state] || 'mdi:shield-sync';
        ]]]
      label: |
        [[[
          return {disarmed: 'Desarmado', armed_away: 'Armado', armed_home: 'Armado (casa)', armed_night: 'Armado (noite)',
                  arming: 'Armando…', pending: 'Pendente', triggered: 'DISPARADO'}[entity?.state] || '--';
        ]]]
      sublabel: Alarme
      active: "[[[ return entity?.state !== 'disarmed' ]]]"
      accent: "var(--catppuccin-red, #ed8796)"
      animation: "[[[ return entity?.state === 'triggered' ? 'pulse-red 1s ease-in-out infinite' : 'none' ]]]"
    tap_action:
      action: more-info
    hold_action:
      action: navigate
      navigation_path: "#alarm"

  # --- To-do: open items across the three local lists ------------------------------
  - type: custom:button-card
    template: tile
    view_layout:
      grid-area: todo
    triggers_update:
      - todo.house_projects
      - todo.quick_tasks
      - todo.personal
    variables:
      icon: mdi:checkbox-marked-outline
      label: |
        [[[
          const n = ['todo.house_projects', 'todo.quick_tasks', 'todo.personal']
            .reduce((sum, id) => sum + (parseInt(states[id]?.state) || 0), 0);
          return n === 0 ? 'Nada pendente' : n === 1 ? '1 tarefa' : `${n} tarefas`;
        ]]]
      sublabel: Projetos · Rápidas · Pessoal
    tap_action:
      action: navigate
      navigation_path: "#todo"

  # --- Feed: live activity rows (each only while active) + weather -------------------
  - type: vertical-stack
    view_layout:
      grid-area: feed
    cards:
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.low_batteries
            above: 0
        card:
          type: custom:button-card
          template: active_row
          variables:
            icon: mdi:battery-alert
            title: Bateria baixa
            accent: "linear-gradient(135deg, rgba(237, 135, 150, 0.85), rgba(245, 169, 127, 0.85))"
            subtitle: |
              [[[
                const devices = states['sensor.low_batteries']?.attributes?.devices || [];
                return devices.map((d) => `${d.name} ${d.level}%`).join(' · ');
              ]]]
          tap_action:
            action: navigate
            navigation_path: "#todo"

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.washer_current_status
            state_not: [power_off, end, unknown, unavailable]
        card:
          type: custom:button-card
          template: active_row
          variables:
            icon: mdi:washing-machine
            title: Lavadora
            animation: spin 2s linear infinite
            subtitle: |
              [[[
                const end = new Date(states['sensor.washer_remaining_time']?.state);
                if (isNaN(end)) return 'Lavando';
                const min = Math.max(0, Math.round((end - Date.now()) / 60000));
                const pad = (n) => String(n).padStart(2, '0');
                return `${Math.floor(min / 60)}:${pad(min % 60)} restantes · termina ${pad(end.getHours())}:${pad(end.getMinutes())}`;
              ]]]
          tap_action:
            action: none

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.dryer_current_status
            state_not: [power_off, end, unknown, unavailable]
        card:
          type: custom:button-card
          template: active_row
          variables:
            icon: mdi:tumble-dryer
            title: Secadora
            animation: spin 2s linear infinite
            accent: "linear-gradient(135deg, rgba(138, 173, 244, 0.85), rgba(125, 196, 228, 0.85))"
            subtitle: |
              [[[
                const end = new Date(states['sensor.dryer_remaining_time']?.state);
                if (isNaN(end)) return 'Secando';
                const min = Math.max(0, Math.round((end - Date.now()) / 60000));
                const pad = (n) => String(n).padStart(2, '0');
                return `${Math.floor(min / 60)}:${pad(min % 60)} restantes · termina ${pad(end.getHours())}:${pad(end.getMinutes())}`;
              ]]]
          tap_action:
            action: none

      - type: conditional
        conditions:
          - condition: state
            entity: vacuum.roborock
            state_not: [docked, unavailable, unknown]
        card:
          type: custom:button-card
          template: active_row
          variables:
            icon: mdi:robot-vacuum
            title: Roborock
            animation: shake 1.2s ease-in-out infinite
            accent: "linear-gradient(135deg, rgba(166, 218, 149, 0.85), rgba(139, 213, 202, 0.85))"
            subtitle: |
              [[[
                const st = {cleaning: 'Limpando', returning: 'Voltando para a base', paused: 'Pausado',
                            idle: 'Parado', error: 'Erro'}[states['vacuum.roborock']?.state] || states['vacuum.roborock']?.state;
                const bat = states['sensor.roborock_qrevo_curv_series_battery']?.state;
                return `${st} · ${bat ?? '--'}%`;
              ]]]
          tap_action:
            action: navigate
            navigation_path: "#vacuum"

      - type: conditional
        conditions:
          - condition: state
            entity: media_player.living_room
            state: playing
        card:
          type: custom:button-card
          template: active_row
          variables:
            play_pause_entity: media_player.living_room
            icon: mdi:music
            accent: "linear-gradient(135deg, rgba(245, 169, 127, 0.85), rgba(238, 153, 160, 0.85))"
            image: "[[[ return states['media_player.living_room']?.attributes?.entity_picture || null ]]]"
            title: "[[[ const t = states['media_player.living_room']?.attributes?.media_title; return t && !/:8097\\/source\\//.test(t) ? t : 'Tocando' ]]]"
            subtitle: "[[[ return `Sala · ${states['media_player.living_room']?.attributes?.media_artist || ''}` ]]]"
          tap_action:
            action: navigate
            navigation_path: "#media"

      - type: conditional
        conditions:
          - condition: state
            entity: media_player.unnamed_room
            state: playing
        card:
          type: custom:button-card
          template: active_row
          variables:
            play_pause_entity: media_player.unnamed_room
            icon: mdi:music
            accent: "linear-gradient(135deg, rgba(245, 169, 127, 0.85), rgba(238, 153, 160, 0.85))"
            image: "[[[ return states['media_player.unnamed_room']?.attributes?.entity_picture || null ]]]"
            title: "[[[ const t = states['media_player.unnamed_room']?.attributes?.media_title; return t && !/:8097\\/source\\//.test(t) ? t : 'Tocando' ]]]"
            subtitle: "[[[ return `Sonos Move · ${states['media_player.unnamed_room']?.attributes?.media_artist || ''}` ]]]"
          tap_action:
            action: navigate
            navigation_path: "#media"

      - type: conditional
        conditions:
          - condition: state
            entity: media_player.kids_bedroom_kids_bedroom
            state: playing
        card:
          type: custom:button-card
          template: active_row
          variables:
            play_pause_entity: media_player.kids_bedroom_kids_bedroom
            icon: mdi:music
            accent: "linear-gradient(135deg, rgba(245, 169, 127, 0.85), rgba(238, 153, 160, 0.85))"
            image: "[[[ return states['media_player.kids_bedroom_kids_bedroom']?.attributes?.entity_picture || null ]]]"
            title: "[[[ const t = states['media_player.kids_bedroom_kids_bedroom']?.attributes?.media_title; return t && !/:8097\\/source\\//.test(t) ? t : 'Tocando' ]]]"
            subtitle: "[[[ return `Quarto das crianças · ${states['media_player.kids_bedroom_kids_bedroom']?.attributes?.media_artist || ''}` ]]]"
          tap_action:
            action: navigate
            navigation_path: "#media"

      - type: custom:weather-forecast-card
        entity: weather.home
        show_current: true
        show_forecast: true
        default_forecast: hourly
        forecast_types: hourly
        show_condition_effects: true
        show_attributes: false
        tap_action:
          action: navigate
          navigation_path: "#weather"
        forecast:
          mode: simple
          hourly_slots: 12
          show_sun_times: true
        card_mod:
          style: |-
            ha-card { background: rgba(36, 39, 58, 0.7); border-radius: 24px; border: 1px solid rgba(202, 211, 245, 0.08); }
