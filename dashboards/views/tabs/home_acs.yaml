type: custom:css-swipe-card
cardId: home_acs
pagination: true
height: 186px
custom_css: !include ../../cards/swipe_css.yaml
# Six positions; sensor.ac_order decides which AC each one shows (ACs that are on first)
cards:
  - type: custom:streamline-card
    template: ac_slot
    variables:
      slot: 0
  - type: custom:streamline-card
    template: ac_slot
    variables:
      slot: 1
  - type: custom:streamline-card
    template: ac_slot
    variables:
      slot: 2
  - type: custom:streamline-card
    template: ac_slot
    variables:
      slot: 3
  - type: custom:streamline-card
    template: ac_slot
    variables:
      slot: 4
  - type: custom:streamline-card
    template: ac_slot
    variables:
      slot: 5
