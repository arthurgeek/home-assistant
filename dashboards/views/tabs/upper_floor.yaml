type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: 1fr 1fr
  # every room card 164px (cards are 12px shorter than their rows); the kids' carousel adds its 26px of markers
  grid-template-rows: 176px 202px
  grid-gap: 10px
  margin: 8px 0 0 0
  grid-template-areas: |
    "office suite"
    "kids kids"
  mediaquery:
    "(min-width: 900px)":
      grid-template-columns: 1fr 1fr 2fr
      # row 2 holds the kids' carousel markers, under its room card, which is level with the other two
      grid-template-rows: 176px 26px
      grid-template-areas: |
        "office suite kids"
        ". . kids"
cards:
  - type: custom:button-card
    template: room_card_v2
    view_layout:
      grid-area: office
    variables:
      area: office
      circle_color: "var(--catppuccin-peach, #f5a97f)"

  - type: custom:button-card
    template: room_card_v2
    view_layout:
      grid-area: suite
    variables:
      area: main_bedroom
      circle_color: "var(--catppuccin-lavender, #b7bdf8)"

  - type: custom:css-swipe-card
    view_layout:
      grid-area: kids
    cardId: upper_floor_kids
    pagination: true
    height: 190px  # a 164px room card, as tall as the others, + 26px of markers below it
    custom_css: !include ../../cards/swipe_css.yaml
    cards:
      - type: custom:button-card
        template: room_card_v2
        # as tall as the office and suite cards; the carousel's markers go below it, not over it
        styles: &kids_room_height
          card:
            - height: 164px
        variables:
          area: kids_bedroom_1
          circle_color: "var(--catppuccin-green, #a6da95)"
      - type: custom:button-card
        template: room_card_v2
        styles: *kids_room_height
        variables:
          area: kids_bedroom_2
          circle_color: "var(--catppuccin-blue, #8aadf4)"
      - type: custom:button-card
        template: room_card_v2
        styles: *kids_room_height
        variables:
          area: kids_bedroom_3
          circle_color: "var(--catppuccin-mauve, #c6a0f6)"
