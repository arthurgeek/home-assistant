type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: 1fr 1fr
  # every room card 164px (cards are 12px shorter than their rows); the kids' carousel adds its 26px of markers
  grid-template-rows: 176px 202px
  grid-gap: 10px
  margin: 8px 0 0 0
  grid-template-areas: |
    "office suite"
    "kids kids"
  mediaquery:
    "(min-width: 900px)":
      grid-template-columns: 1fr 1fr 2fr
      # row 2 holds the kids' carousel markers, under its room card, which is level with the other two
      grid-template-rows: 176px 26px
      grid-template-areas: |
        "office suite kids"
        ". . kids"
cards:
  - type: custom:button-card
    template: room_card_v2
    view_layout:
      grid-area: office
    variables:
      room: sensor.office_room
      icon: mdi:desk
      circle_color: "var(--catppuccin-mauve, #c6a0f6)"
      temp_sensor: sensor.office_office_air_conditioner_temperature
      presence: binary_sensor.office_presence
      lights:
        - light.office_light
      popup: "#office"
      buttons:
        - icon: mdi:lightbulb
          entity: light.office_light
          kind: toggle
        - icon: mdi:air-conditioner
          entity: climate.office_ac
          kind: ac

  - type: custom:button-card
    template: room_card_v2
    view_layout:
      grid-area: suite
    variables:
      room: sensor.main_bedroom_room
      icon: mdi:bed-king
      circle_color: "var(--catppuccin-lavender, #b7bdf8)"
      temp_sensor: sensor.main_bedroom_main_bedroom_ac_temperature
      popup: "#main_bedroom"
      buttons:
        - icon: mdi:air-conditioner
          entity: climate.main_bedroom_ac
          kind: ac

  - type: custom:css-swipe-card
    view_layout:
      grid-area: kids
    cardId: upper_floor_kids
    pagination: true
    height: 190px  # a 164px room card, as tall as the others, + 26px of markers below it
    custom_css: !include ../../cards/swipe_css.yaml
    cards:
      - type: custom:button-card
        template: room_card_v2
        # as tall as the office and suite cards; the carousel's markers go below it, not over it
        styles: &kids_room_height
          card:
            - height: 164px
        variables:
          room: sensor.kids_bedroom_1_room
          icon: mdi:bed
          circle_color: "var(--catppuccin-sapphire, #7dc4e4)"
          temp_sensor: sensor.kids_bedroom_1_ac_temperature
          popup: "#kids_bedroom_1"
          buttons:
            - icon: mdi:air-conditioner
              entity: climate.kids_bedroom_1_ac
              kind: ac
      - type: custom:button-card
        template: room_card_v2
        styles: *kids_room_height
        variables:
          room: sensor.kids_bedroom_2_room
          icon: mdi:bed
          circle_color: "var(--catppuccin-teal, #8bd5ca)"
          temp_sensor: sensor.kids_bedroom_2_ac_temperature
          popup: "#kids_bedroom_2"
          buttons:
            - icon: mdi:air-conditioner
              entity: climate.kids_bedroom_2_ac
              kind: ac
      - type: custom:button-card
        template: room_card_v2
        styles: *kids_room_height
        variables:
          room: sensor.kids_bedroom_3_room
          icon: mdi:bed
          circle_color: "var(--catppuccin-pink, #f5bde6)"
          temp_sensor: sensor.kids_bedroom_3_ac_temperature
          popup: "#kids_bedroom_3"
          buttons:
            - icon: mdi:air-conditioner
              entity: climate.kids_bedroom_3_ac
              kind: ac
