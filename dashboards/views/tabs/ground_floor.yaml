type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: 1fr 1fr
  grid-template-rows: 220px
  grid-gap: 10px
  margin: 8px 0 0 0
  grid-template-areas: |
    "living_room living_room"
  mediaquery:
    "(min-width: 900px)":
      grid-template-columns: 2fr 1fr 1fr
      grid-template-rows: 220px
      grid-template-areas: |
        "living_room . ."
cards:
  - type: custom:button-card
    template: room_card_v2
    view_layout:
      grid-area: living_room
    variables:
      area: living_room
      circle_color: "var(--catppuccin-green, #a6da95)"
      # not placed in the area's lights or ACs, so passed in after the generated buttons
      buttons:
        - icon: mdi:door
          entity: button.main_door_unlock
          kind: press
          press_entity: button.main_door_unlock
        - icon: mdi:television
          entity: media_player.tv_samsung_6_series_55
          kind: toggle
